<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Guide</title>

<style>
*{
    margin:0;
    padding*0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    overflow:hidden;
}

/* MENU PAGE */
#menuPage{
    display:flex;
   *flex-direction:column;
    justify*content:center;
    align-items:ce*ter;
    height:100vh;
    gap:15p*;
}

.photo-btn{
    width*250*x;
    padding:15px;
    border*none;
    border-radius:12px;
    *ont*size:18px;
    cursor:pointer;
   *background*#2196f3;
    color:white;
}

/* CAMERA PAGE */
#cameraPage{
    display:none;
 *  width:100vw;
    height:100vh;
 *  position:relative;
}

video{
   *position:absolute;
    width:100%;*    height:100%;
    object*fit:cover;
}

/* Overlay */
.overlay{
    position:absolute;*    inset:0;
    pointer-events:no*e;
}

.line{
    position:absolute*
    width:100%;
    border-top*1px solid rgba(255,255,255,0.6*;
}

.label{
    position:absolute*
    right:10px;
    color:white;
*   background*rgba(0,0,0,0.5);
    padding*2px 8px;
    border-radius:6px;
  * font*size:12px;
}

/* Portrait guides */
.headspace{
    top*30%;
}
.eye{
    top:38%;
}
.shoul*er{
    top:48%;
}
.waist{
    top*65*;
}
.foot{
    bottom:5%;
}

/* Vertical Center */
.center-line{
    position:absolute;
    left:50%;
    top:0;
    height:100%;
    border-left:1px dashed rgba(255,255,255,0.6);
}

/* Level indicator */
.level{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.6);
    padding:8px 15px;
    border-radius:20px;
    z-index:2;
}
</style>
</head>
<body>

<!-- PAGE 1 -->
<div id="menuPage">
    <h1>Select Photo Type</h1>

    <button class="photo-btn" onclick="startCamera('portrait')">
        Portrait
    </button>

    <button class="photo-btn" onclick="startCamera('halfbody')">
        Half Body
    </button>

    <button class="photo-btn" onclick="startCamera('fullbody')">
        Full Body
    </button>

    <button class="photo-btn" onclick="startCamera('landscape')">
        Landscape
    </button>
</div>

<!-- PAGE 2 -->
<div id="cameraPage">

    <video id="video" autoplay playsinline></video>

    <div class="level">
        Tilt: <span id="tiltValue">0°</span>
    </div>

    <div class="overlay">

        <div class="center-line"></div>

        <div class="line headspace"></div>
        <div class="label" style="top:29%;">
            Head Space (30%)
        </div>

        <div class="line eye"></div>
        <div class="label" style="top:37%;">
            Eyes
        </div>

        <div class="line shoulder"></div>
        <div class="label" style="top:47%;">
            Shoulders
        </div>

        <div class="line waist"></div>
        <div class="label" style="top:64%;">
            Waist
        </div>

        <div class="line foot"></div>
        <div class="label" style="bottom:6%;">
            Feet
        </div>

    </div>

</div>

<script>

async function startCamera(type){

    document.getElementById("menuPage").style.display="none";
    document.getElementById("cameraPage").style.display="block";

    try{
        const stream = await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"environment"
            }
        });

        document.getElementById("video").srcObject = stream;

    }catch(err){
        alert("Camera access denied.");
    }
}

// phone tilt indicator
window.addEventListener("deviceorientation",(event)=>{

    let tilt = Math.round(event.gamma || 0);

    document.getElementById("tiltValue").innerText =
        tilt + "°";

});

</script>

</body>
</html>
