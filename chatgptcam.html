<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Photo Guide</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#111;
    color:white;
    overflow:hidden;
}

/* ==========================
   MENU PAGE
========================== */

#menuPage{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:15px;
    height:100vh;
    padding:20px;
}

#menuPage h1{
    margin-bottom:20px;
}

.photo-btn{
    width:280px;
    padding:18px;
    border:none;
    border-radius:12px;
    background:#1e88e5;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.photo-btn:hover{
    background:#1565c0;
}

/* ==========================
   CAMERA PAGE
========================== */

#cameraPage{
    display:none;
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ==========================
   OVERLAY
========================== */

.overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
}

/* Center alignment line */

.center-line{
    position:absolute;
    left:50%;
    top:0;
    height:100%;
    border-left:3px solid rgba(255,255,255,0.95);
    box-shadow:0 0 10px rgba(255,255,255,0.8);
}

/* Guide Lines */

.line{
    position:absolute;
    left:0;
    width:100%;
    height:2px;
}

/* Guide Band */

.line::after{
    content:'';
    position:absolute;
    left:0;
    top:-8px;
    width:100%;
    height:16px;
}

/* HEADSPACE */

.headspace{
    top:30%;
    background:#00ff88;
    box-shadow:0 0 12px #00ff88;
}

.headspace::after{
    background:rgba(0,255,136,0.15);
}

/* EYE */

.eye{
    top:40%;
    background:#00bfff;
    box-shadow:0 0 12px #00bfff;
}

.eye::after{
    background:rgba(0,191,255,0.15);
}

/* SHOULDER */

.shoulder{
    top:50%;
    background:#ffd600;
    box-shadow:0 0 12px #ffd600;
}

.shoulder::after{
    background:rgba(255,214,0,0.15);
}

/* WAIST */

.waist{
    top:68%;
    background:#ff9800;
    box-shadow:0 0 12px #ff9800;
}

.waist::after{
    background:rgba(255,152,0,0.15);
}

/* FOOT */

.foot{
    top:92%;
    background:#ff5252;
    box-shadow:0 0 12px #ff5252;
}

.foot::after{
    background:rgba(255,82,82,0.15);
}

/* Labels */

.label{
    position:absolute;
    right:10px;
    transform:translateY(-50%);
    padding:4px 10px;
    border-radius:6px;
    background:rgba(0,0,0,0.6);
    font-size:12px;
    font-weight:bold;
}

/* Human Guide Area */

.person-guide{
    position:absolute;
    left:50%;
    top:30%;
    transform:translateX(-50%);
    width:40%;
    height:62%;
    border:3px dashed rgba(255,255,255,0.7);
    border-radius:180px 180px 30px 30px;
    background:rgba(255,255,255,0.04);
}

/* Tilt Indicator */

.level-container{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.6);
    padding:10px 20px;
    border-radius:25px;
    font-weight:bold;
    z-index:999;
}

/* Back Button */

.back-btn{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:999;
    padding:12px 25px;
    border:none;
    border-radius:10px;
    font-size:16px;
    background:#f44336;
    color:white;
    cursor:pointer;
}

</style>
</head>

<body>

<!-- ==========================
     PAGE 1
=========================== -->

<div id="menuPage">

    <h1>Select Photo Type</h1>

    <button class="photo-btn" onclick="startCamera('portrait')">
        Portrait
    </button>

    <button class="photo-btn" onclick="startCamera('halfbody')">
        Half Body
    </button>

    <button class="photo-btn" onclick="startCamera('fullbody')">
        Full Body
    </button>

    <button class="photo-btn" onclick="startCamera('landscape')">
        Landscape
    </button>

</div>

<!-- ==========================
     PAGE 2
=========================== -->

<div id="cameraPage">

    <video id="video" autoplay playsinline></video>

    <div class="level-container">
        Phone Level:
        <span id="tiltValue">0°</span>
    </div>

    <div class="overlay">

        <!-- Person Outline -->
        <div class="person-guide"></div>

        <!-- Center Line -->
        <div class="center-line"></div>

        <!-- Head Space -->
        <div class="line headspace"></div>
        <div class="label" style="top:30%;">
            Head Space 30%
        </div>

        <!-- Eye -->
        <div class="line eye"></div>
        <div class="label" style="top:40%;">
            Eye Level
        </div>

        <!-- Shoulder -->
        <div class="line shoulder"></div>
        <div class="label" style="top:50%;">
            Shoulder
        </div>

        <!-- Waist -->
        <div class="line waist"></div>
        <div class="label" style="top:68%;">
            Waist
        </div>

        <!-- Foot -->
        <div class="line foot"></div>
        <div class="label" style="top:92%;">
            Foot
        </div>

    </div>

    <button class="back-btn" onclick="goBack()">
        Back
    </button>

</div>

<script>

let mediaStream = null;

async function startCamera(type){

    document.getElementById('menuPage').style.display='none';
    document.getElementById('cameraPage').style.display='block';

    try{

        mediaStream = await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"environment"
            }
        });

        document.getElementById('video').srcObject = mediaStream;

    }
    catch(error){

        alert('Camera permission denied or camera unavailable.');

    }
}

function goBack(){

    if(mediaStream){

        mediaStream.getTracks().forEach(track=>{
            track.stop();
        });

    }

    document.getElementById('cameraPage').style.display='none';
    document.getElementById('menuPage').style.display='flex';
}

window.addEventListener('deviceorientation', function(event){

    const gamma = Math.round(event.gamma || 0);

    document.getElementById('tiltValue').textContent =
        gamma + "°";

});

</script>

</body>
</html>
