<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shot Guide</title>
<style>
  :root{
    --bg:#121314; --panel:#1c1e20; --line:#2c2f32;
    --text:#f2f0ec; --muted:#9a9d9f; --accent:#6fb8ad; --warn:#e0a15c; --good:#7fce8c;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
  }
  #permask{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px 26px;
  }
  #permask .icon{
    width:56px; height:56px; border-radius:50%; border:2px solid var(--accent);
    display:flex; align-items:center; justify-content:center; margin-bottom:18px; font-size:1.4rem;
  }
  #permask h1{ font-size:1.25rem; font-weight:600; margin:0 0 8px; }
  #permask p{ color:var(--muted); font-size:0.9rem; line-height:1.4; max-width:320px; margin:0 0 26px; }
  #permask button{
    background:var(--accent); color:#0e1211; border:none; border-radius:24px;
    padding:13px 28px; font-size:0.95rem; font-weight:600; cursor:pointer;
  }
  #permask .status{ margin-top:16px; font-size:0.82rem; color:var(--warn); min-height:1.2em; }

  #menu{
    height:100%; display:none; flex-direction:column; padding:28px 20px;
  }
  #menu.active{ display:flex; }
  #menu h1{ font-size:1.4rem; font-weight:600; margin:8px 0 2px; }
  #menu p.sub{ color:var(--muted); margin:0 0 22px; font-size:0.92rem; }
  .grid{ display:grid; grid-template-columns:1fr; gap:12px; overflow-y:auto; padding-bottom:12px; }
  .shot{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:16px 14px; text-align:left; color:var(--text); cursor:pointer;
    display:flex; flex-direction:column; gap:10px; -webkit-tap-highlight-color:transparent;
  }
  .shot:active{ border-color:var(--accent); }
  .frame{ align-self:flex-start; border:2px solid var(--muted); }
  .shot .name{ font-size:0.98rem; font-weight:600; }
  .shot .desc{ font-size:0.8rem; color:var(--muted); line-height:1.3; }

  #cam{ position:fixed; inset:0; display:none; background:#000; }
  #cam.active{ display:block; }
  video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  svg#guide{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .topbar{
    position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); left:14px; right:14px;
    display:flex; justify-content:space-between; align-items:center; z-index:5;
  }
  .pill{
    background:rgba(20,20,20,0.55); backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,0.15); color:var(--text);
    padding:8px 14px; border-radius:20px; font-size:0.85rem; cursor:pointer;
  }
  #tip{
    position:absolute; bottom:calc(26px + env(safe-area-inset-bottom,0px)); left:16px; right:16px;
    text-align:center; color:var(--text); font-size:0.88rem;
    background:rgba(20,20,20,0.55); backdrop-filter:blur(4px); border-radius:10px; padding:10px 14px;
    border:1px solid rgba(255,255,255,0.12);
  }
  #level{
    position:absolute; top:50%; left:50%; width:70px; height:70px; margin:-35px 0 0 -35px;
    border-radius:50%; border:2px solid rgba(255,255,255,0.35); z-index:4; display:none;
  }
  #level.on{ display:block; }
  #level .dot{
    position:absolute; width:14px; height:14px; border-radius:50%; background:var(--warn);
    top:50%; left:50%; margin:-7px 0 0 -7px; transition:background 0.15s;
  }
  #err{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--muted); text-align:center; padding:30px; font-size:0.9rem;
  }
</style>
</head>
<body>

<div id="permask">
  <div class="icon">📷</div>
  <h1>Camera access needed</h1>
  <p>This guide overlays framing lines on your live camera view. Allow camera access to continue.</p>
  <button id="allowBtn">Allow camera access</button>
  <div class="status" id="permStatus"></div>
</div>

<div id="menu">
  <h1>What are you shooting?</h1>
  <p class="sub">Pick a shot type — you'll get framing lines matched to it.</p>
  <div class="grid" id="grid"></div>
</div>

<div id="cam">
  <video id="video" playsinline autoplay muted></video>
  <svg id="guide" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
  <div id="level"><div class="dot"></div></div>
  <div class="topbar">
    <div class="pill" id="back">← Menu</div>
    <div class="pill" id="shotLabel"></div>
  </div>
  <div id="tip"></div>
</div>

<script>
const SHOTS = [
  { id:'portrait', name:'Portrait', desc:'One person, upright', ratio:[3,4],
    tip:'Keep eyes on the upper third line. Leave a little headroom, not too much.' },
  { id:'group', name:'Group', desc:'Several people', ratio:[4,3],
    tip:'Fit everyone inside the inner frame with even space on both sides.' },
  { id:'macro', name:'Close-up', desc:'Small details', ratio:[1,1],
    tip:'Fill the center circle with your subject and hold steady.' },
];

const grid = document.getElementById('grid');
SHOTS.forEach(s=>{
  const b = document.createElement('button');
  b.className = 'shot';
  const [w,h] = s.ratio;
  const boxW = 46, boxH = Math.round(boxW*h/w);
  b.innerHTML = `<div class="frame" style="width:${boxW}px;height:${boxH}px"></div>
                 <div class="name">${s.name}</div>
                 <div class="desc">${s.desc}</div>`;
  b.onclick = () => openCamera(s);
  grid.appendChild(b);
});

const permEl = document.getElementById('permask');
const camEl = document.getElementById('cam');
const menuEl = document.getElementById('menu');
const video = document.getElementById('video');
const guide = document.getElementById('guide');
const tip = document.getElementById('tip');
const shotLabel = document.getElementById('shotLabel');
const levelEl = document.getElementById('level');
let stream = null;

const allowBtn = document.getElementById('allowBtn');
const permStatus = document.getElementById('permStatus');
allowBtn.onclick = async () => {
  allowBtn.disabled = true;
  permStatus.style.color = 'var(--muted)';
  permStatus.textContent = 'Requesting…';
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'environment' }, audio:false
    });
    permEl.style.display = 'none';
    menuEl.classList.add('active');
  }catch(e){
    allowBtn.disabled = false;
    permStatus.style.color = 'var(--warn)';
    permStatus.textContent = e.name === 'NotAllowedError'
      ? 'Permission denied — allow camera access in your browser settings, then try again.'
      : 'No camera found or it could not be started.';
  }
};

function drawGuide(shot){
  guide.innerHTML = '';
  const ns = 'http://www.w3.org/2000/svg';
  const addLine = (x1,y1,x2,y2,dash)=>{
    const l = document.createElementNS(ns,'line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1);
    l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke','rgba(255,255,255,0.55)');
    l.setAttribute('stroke-width','0.3');
    if(dash) l.setAttribute('stroke-dasharray','1.2,1.2');
    guide.appendChild(l);
  };
  // rule of thirds grid, always
  addLine(33.3,0,33.3,100); addLine(66.6,0,66.6,100);
  addLine(0,33.3,100,33.3); addLine(0,66.6,100,66.6);

  if(shot.id==='landscape'){
    addLine(0,33.3,100,33.3,false); // emphasize horizon line already there
  }
  if(shot.id==='macro'){
    const c = document.createElementNS(ns,'circle');
    c.setAttribute('cx',50); c.setAttribute('cy',50); c.setAttribute('r',22);
    c.setAttribute('fill','none'); c.setAttribute('stroke','rgba(255,255,255,0.6)');
    c.setAttribute('stroke-width','0.4'); c.setAttribute('stroke-dasharray','1.5,1.5');
    guide.appendChild(c);
  }
  if(shot.id==='square' || shot.id==='group'){
    const [w,h] = shot.ratio;
    let rw=80, rh=80*h/w;
    if(rh>90){ rh=90; rw=90*w/h; }
    const x=(100-rw)/2, y=(100-rh)/2;
    const r = document.createElementNS(ns,'rect');
    r.setAttribute('x',x); r.setAttribute('y',y);
    r.setAttribute('width',rw); r.setAttribute('height',rh);
    r.setAttribute('fill','none'); r.setAttribute('stroke','rgba(255,255,255,0.6)');
    r.setAttribute('stroke-width','0.4');
    guide.appendChild(r);
  }
  if(shot.id==='portrait'){
    addLine(50,0,50,100,true);
  }
}

async function openCamera(shot){
  shotLabel.textContent = shot.name;
  tip.textContent = shot.tip;
  drawGuide(shot);
  menuEl.classList.remove('active');
  camEl.classList.add('active');
  if(!stream){
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:'environment' }, audio:false
      });
    }catch(e){
      camEl.innerHTML = `<div id="err">Couldn't access the camera.<br>Check your browser's camera permission and try again.</div>
        <div class="topbar"><div class="pill" id="back2">← Menu</div><div></div></div>`;
      document.getElementById('back2').onclick = closeCamera;
      return;
    }
  }
  video.srcObject = stream;
  startLevel();
}

function closeCamera(){
  camEl.classList.remove('active');
  menuEl.classList.add('active');
  window.removeEventListener('deviceorientation', onTilt);
}
document.getElementById('back').onclick = closeCamera;

function onTilt(e){
  const dot = document.querySelector('#level .dot');
  const lv = document.getElementById('level');
  if(!dot) return;
  const beta = e.beta || 0;   // front-back tilt
  const gamma = e.gamma || 0; // left-right tilt
  const dx = Math.max(-25,Math.min(25,gamma));
  const dy = Math.max(-25,Math.min(25,beta-90 > -90 ? beta : beta));
  const dyClamped = Math.max(-25,Math.min(25,(beta)));
  dot.style.transform = `translate(${dx}px, ${Math.max(-25,Math.min(25,dyClamped-0))*0+Math.max(-25,Math.min(25,gamma*0+ (beta-0)))*0}px)`;
  // simplified level: use gamma (roll) mainly, since beta varies with hold angle
  const roll = gamma;
  dot.style.transform = `translate(${Math.max(-25,Math.min(25,roll))}px, 0px)`;
  const level = Math.abs(roll) < 3;
  dot.style.background = level ? 'var(--good)' : 'var(--warn)';
  lv.style.borderColor = level ? 'rgba(127,206,140,0.6)' : 'rgba(255,255,255,0.35)';
}

function startLevel(){
  const lv = document.getElementById('level');
  if(typeof DeviceOrientationEvent !== 'undefined'){
    lv.classList.add('on');
    if(typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission().then(res=>{
        if(res === 'granted') window.addEventListener('deviceorientation', onTilt);
      }).catch(()=>{});
    } else {
      window.addEventListener('deviceorientation', onTilt);
    }
  }
}
</script>
</body>
</html>
