<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shot Guide</title>
<style>
  :root{
    --bg:#121314; --panel:#1c1e20; --line:#2c2f32;
    --text:#f2f0ec; --muted:#9a9d9f; --accent:#6fb8ad; --warn:#e0a15c; --good:#7fce8c;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
  }
  #permask{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px 26px;
  }
  #permask .icon{
    width:56px; height:56px; border-radius:50%; border:2px solid var(--accent);
    display:flex; align-items:center; justify-content:center; margin-bottom:18px; font-size:1.4rem;
  }
  #permask h1{ font-size:1.25rem; font-weight:600; margin:0 0 8px; }
  #permask p{ color:var(--muted); font-size:0.9rem; line-height:1.4; max-width:320px; margin:0 0 26px; }
  #permask button{
    background:var(--accent); color:#0e1211; border:none; border-radius:24px;
    padding:13px 28px; font-size:0.95rem; font-weight:600; cursor:pointer;
  }
  #permask .status{ margin-top:16px; font-size:0.82rem; color:var(--warn); min-height:1.2em; }

  #menu{
    height:100%; display:none; flex-direction:column; padding:28px 20px;
  }
  #menu.active{ display:flex; }
  #menu h1{ font-size:1.4rem; font-weight:600; margin:8px 0 2px; }
  #menu p.sub{ color:var(--muted); margin:0 0 22px; font-size:0.92rem; }
  .grid{ display:grid; grid-template-columns:1fr; gap:12px; overflow-y:auto; padding-bottom:12px; }
  .shot{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:16px 14px; text-align:left; color:var(--text); cursor:pointer;
    display:flex; flex-direction:column; gap:10px; -webkit-tap-highlight-color:transparent;
  }
  .shot:active{ border-color:var(--accent); }
  .frame{ align-self:flex-start; border:2px solid var(--muted); }
  .shot .name{ font-size:0.98rem; font-weight:600; }
  .shot .desc{ font-size:0.8rem; color:var(--muted); line-height:1.3; }

  #cam{ position:fixed; inset:0; display:none; background:#000; }
  #cam.active{ display:block; }
  video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  canvas#guide{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .topbar{
    position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); left:14px; right:14px;
    display:flex; justify-content:space-between; align-items:center; z-index:5;
  }
  .pill{
    background:rgba(20,20,20,0.55); backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,0.15); color:var(--text);
    padding:8px 14px; border-radius:20px; font-size:0.85rem; cursor:pointer;
  }
  #tip{
    position:absolute; bottom:calc(26px + env(safe-area-inset-bottom,0px)); left:16px; right:16px;
    text-align:center; color:var(--text); font-size:0.88rem;
    background:rgba(20,20,20,0.55); backdrop-filter:blur(4px); border-radius:10px; padding:10px 14px;
    border:1px solid rgba(255,255,255,0.12);
  }
  #levelSvg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; display:none; }
  #levelSvg.on{ display:block; }
  #levelLabel{
    position:absolute; top:calc(50% + 34px); left:50%; transform:translateX(-50%);
    font-size:0.72rem; color:var(--muted); background:rgba(20,20,20,0.5);
    padding:3px 9px; border-radius:10px; display:none; letter-spacing:0.2px;
  }
  #levelLabel.on{ display:block; }
  #err{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--muted); text-align:center; padding:30px; font-size:0.9rem;
  }
  .shutterWrap{
    position:absolute; bottom:calc(96px + env(safe-area-inset-bottom,0px)); left:0; right:0;
    display:flex; justify-content:center; z-index:5;
  }
  #shutterBtn{
    width:68px; height:68px; border-radius:50%; border:3px solid rgba(255,255,255,0.85);
    background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0;
  }
  #shutterBtn span{ width:54px; height:54px; border-radius:50%; background:#fff; display:block; }
  #shutterBtn:active{ transform:scale(0.93); }

  #preview{
    position:fixed; inset:0; display:none; background:#000;
    flex-direction:column;
  }
  #preview.active{ display:flex; }
  #preview img{ flex:1; width:100%; min-height:0; object-fit:contain; background:#000; }
  .previewBar{
    display:flex; gap:12px; padding:16px 20px calc(env(safe-area-inset-bottom,0px) + 20px);
  }
  .previewBar a, .previewBar button{
    flex:1; padding:14px; border-radius:14px; font-size:0.95rem; font-weight:600;
    text-align:center; text-decoration:none; border:none; cursor:pointer;
  }
  .previewBar .retake{ background:var(--panel); color:var(--text); border:1px solid var(--line); }
  .previewBar .save{ background:var(--accent); color:#0e1211; }
</style>
</head>
<body>

<div id="permask">
  <div class="icon">📷</div>
  <h1>Camera access needed</h1>
  <p>This guide overlays framing lines on your live camera view. Allow camera access to continue.</p>
  <button id="allowBtn">Allow camera access</button>
  <div class="status" id="permStatus"></div>
</div>

<div id="menu">
  <h1>What are you shooting?</h1>
  <p class="sub">Pick a shot type — you'll get framing lines matched to it.</p>
  <div class="grid" id="grid"></div>
</div>

<div id="cam">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="guide"></canvas>
  <svg id="levelSvg" viewBox="0 0 100 100" preserveAspectRatio="none">
    <line x1="20" y1="50" x2="80" y2="50" stroke="rgba(255,255,255,0.4)" stroke-width="0.5" stroke-dasharray="1.5,1.5"/>
    <line id="liveLine" x1="20" y1="50" x2="80" y2="50" stroke-width="0.8" stroke="var(--warn)"/>
  </svg>
  <div id="levelLabel">Tilt until the lines meet</div>
  <div class="topbar">
    <div class="pill" id="back">← Menu</div>
    <div class="pill" id="shotLabel"></div>
  </div>
  <div class="shutterWrap"><button id="shutterBtn" aria-label="Take photo"><span></span></button></div>
  <div id="tip"></div>
</div>

<div id="preview">
  <img id="shotImg" alt="Your photo">
  <div class="previewBar">
    <button class="retake" id="retakeBtn">Retake</button>
    <a class="save" id="saveBtn" download="photo.jpg">Save</a>
  </div>
</div>

<script>
const SHOTS = [
  { id:'portrait', name:'Portrait', desc:'One person, upright', ratio:[3,4],
    tip:'Keep the head below the dashed headroom line — about 30% empty space above it. Eyes on the eye line, never crop at the chin, waist is a safe crop point.' },
  { id:'group', name:'Group', desc:'Several people', ratio:[4,3],
    tip:'Keep every head below the dashed headroom line, evenly spaced. Korean style: shoot a little from above so everyone looks slimmer and taller.' },
  { id:'macro', name:'Close-up', desc:'Small details', ratio:[1,1],
    tip:'Korean style: use a cup, book or flower as a prop for a natural, candid feel. Fill the circle, shoot at a soft 45° angle.' },
];

const grid = document.getElementById('grid');
SHOTS.forEach(s=>{
  const b = document.createElement('button');
  b.className = 'shot';
  const [w,h] = s.ratio;
  const boxW = 46, boxH = Math.round(boxW*h/w);
  b.innerHTML = `<div class="frame" style="width:${boxW}px;height:${boxH}px"></div>
                 <div class="name">${s.name}</div>
                 <div class="desc">${s.desc}</div>`;
  b.onclick = () => openCamera(s);
  grid.appendChild(b);
});

const permEl = document.getElementById('permask');
const camEl = document.getElementById('cam');
const menuEl = document.getElementById('menu');
const video = document.getElementById('video');
const guide = document.getElementById('guide');
const tip = document.getElementById('tip');
const shotLabel = document.getElementById('shotLabel');
const levelEl = document.getElementById('level');
let stream = null;

const allowBtn = document.getElementById('allowBtn');
const permStatus = document.getElementById('permStatus');
allowBtn.onclick = async () => {
  allowBtn.disabled = true;
  permStatus.style.color = 'var(--muted)';
  permStatus.textContent = 'Requesting…';
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'environment' }, audio:false
    });
    permEl.style.display = 'none';
    menuEl.classList.add('active');
  }catch(e){
    allowBtn.disabled = false;
    permStatus.style.color = 'var(--warn)';
    permStatus.textContent = e.name === 'NotAllowedError'
      ? 'Permission denied — allow camera access in your browser settings, then try again.'
      : 'No camera found or it could not be started.';
  }
};

let currentShot = null;

function drawFigure(ctx, cx, headCy, r, full){
  const eyeY      = headCy - r*0.10;
  const chinY     = headCy + r*1.20;
  const neckY     = chinY + r*0.22;
  const shoulderY = neckY + r*0.18;
  const shoulderW = r*2.5;
  const waistY    = shoulderY + r*2.30;
  const waistW    = shoulderW*0.82;

  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,0.58)';
  ctx.lineWidth = 1.6;
  ctx.setLineDash([6,6]);

  // head
  ctx.beginPath();
  ctx.ellipse(cx, headCy, r, r*1.22, 0, 0, Math.PI*2);
  ctx.stroke();

  // eye line — where the eyes should sit
  ctx.setLineDash([3,4]);
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.moveTo(cx - r*1.5, eyeY); ctx.lineTo(cx + r*1.5, eyeY);
  ctx.stroke();

  ctx.setLineDash([6,6]);
  ctx.strokeStyle = 'rgba(255,255,255,0.58)';
  ctx.lineWidth = 1.6;

  // neck
  ctx.beginPath();
  ctx.moveTo(cx - r*0.28, chinY); ctx.lineTo(cx - r*0.32, shoulderY);
  ctx.moveTo(cx + r*0.28, chinY); ctx.lineTo(cx + r*0.32, shoulderY);
  ctx.stroke();

  // shoulders
  ctx.beginPath();
  ctx.moveTo(cx - shoulderW/2, shoulderY + r*0.2);
  ctx.quadraticCurveTo(cx, shoulderY - r*0.2, cx + shoulderW/2, shoulderY + r*0.2);
  ctx.stroke();

  // torso tapering to waist
  ctx.beginPath();
  ctx.moveTo(cx - shoulderW/2, shoulderY + r*0.2);
  ctx.quadraticCurveTo(cx - waistW*0.55, shoulderY + (waistY-shoulderY)*0.55, cx - waistW/2, waistY);
  ctx.moveTo(cx + shoulderW/2, shoulderY + r*0.2);
  ctx.quadraticCurveTo(cx + waistW*0.55, shoulderY + (waistY-shoulderY)*0.55, cx + waistW/2, waistY);
  ctx.stroke();

  const warn = (y, label)=>{
    ctx.save();
    ctx.strokeStyle = 'rgba(224,110,100,0.85)';
    ctx.fillStyle = 'rgba(240,150,140,0.95)';
    ctx.lineWidth = 1.1;
    ctx.setLineDash([5,4]);
    ctx.beginPath();
    ctx.moveTo(cx - shoulderW*0.9, y); ctx.lineTo(cx + shoulderW*0.9, y);
    ctx.stroke();
    ctx.font = '600 10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 5;
    ctx.fillText(label, cx, y - 6);
    ctx.restore();
  };

  if(!full){
    // bust framing: chin is a hard "don't crop", waist is a safe crop line
    warn(chinY, "don't crop the chin");
    ctx.save();
    ctx.setLineDash([4,5]);
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(cx - waistW*0.75, waistY); ctx.lineTo(cx + waistW*0.75, waistY);
    ctx.stroke();
    ctx.font = '600 10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 5;
    ctx.fillText('safe crop at waist', cx, waistY + 14);
    ctx.restore();
  } else {
    const hipY = waistY + r*0.28;
    const hipW = waistW*0.95;
    const legLen = r*4.2;
    const footY = hipY + legLen;
    const kneeY = hipY + legLen*0.48;
    const ankleY = footY - r*0.15;
    const legSpread = r*0.58;

    ctx.beginPath();
    ctx.moveTo(cx - hipW*0.3, hipY);
    ctx.quadraticCurveTo(cx - legSpread - r*0.08, hipY + legLen*0.55, cx - legSpread, footY - r*0.12);
    ctx.moveTo(cx + hipW*0.3, hipY);
    ctx.quadraticCurveTo(cx + legSpread + r*0.08, hipY + legLen*0.55, cx + legSpread, footY - r*0.12);
    ctx.stroke();

    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.ellipse(cx - legSpread, footY, r*0.32, r*0.11, 0, 0, Math.PI*2);
    ctx.ellipse(cx + legSpread, footY, r*0.32, r*0.11, 0, 0, Math.PI*2);
    ctx.stroke();

    warn(kneeY, "don't crop at knees");
    warn(ankleY, "don't crop at ankles");
  }
  ctx.restore();
}

function drawHeadroom(ctx, w, h){
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1.2;
  ctx.setLineDash([8,6]);
  ctx.beginPath();
  ctx.moveTo(0, h*0.30); ctx.lineTo(w, h*0.30);
  ctx.stroke();
  ctx.font = '600 10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.textAlign = 'left';
  ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 5;
  ctx.fillText('leave ~30% empty above the head', 10, h*0.30 - 8);
  ctx.restore();
}

function drawGuide(shot){
  currentShot = shot;
  const w = guide.clientWidth, h = guide.clientHeight;
  if(!w || !h) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  guide.width = Math.round(w*dpr); guide.height = Math.round(h*dpr);
  const ctx = guide.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  // rule of thirds, always
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.32)';
  ctx.lineWidth = 1;
  ctx.setLineDash([5,7]);
  ctx.beginPath();
  ctx.moveTo(w/3,0); ctx.lineTo(w/3,h);
  ctx.moveTo(w*2/3,0); ctx.lineTo(w*2/3,h);
  ctx.moveTo(0,h/3); ctx.lineTo(w,h/3);
  ctx.moveTo(0,h*2/3); ctx.lineTo(w,h*2/3);
  ctx.stroke();
  ctx.restore();

  if(shot.id === 'macro'){
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1.4;
    ctx.setLineDash([6,6]);
    ctx.beginPath();
    ctx.arc(w/2, h/2, Math.min(w,h)*0.28, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  if(shot.id === 'portrait'){
    drawHeadroom(ctx, w, h);
    const r = w*0.095;
    const headCy = h*0.30 + r*1.22;   // head top sits right on the 30% line
    drawFigure(ctx, w*0.5, headCy, r, false);
  }
  if(shot.id === 'group'){
    drawHeadroom(ctx, w, h);
    const r = w*0.05;
    const headCy = h*0.30 + r*1.22;
    drawFigure(ctx, w*0.25, headCy + h*0.015, r*0.9, false);
    drawFigure(ctx, w*0.50, headCy,           r,     false);
    drawFigure(ctx, w*0.75, headCy + h*0.015, r*0.9, false);
  }
}
window.addEventListener('resize', ()=>{ if(currentShot) drawGuide(currentShot); });

async function openCamera(shot){
  shotLabel.textContent = shot.name;
  tip.textContent = shot.tip;
  menuEl.classList.remove('active');
  camEl.classList.add('active');
  drawGuide(shot);
  if(!stream){
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:'environment' }, audio:false
      });
    }catch(e){
      camEl.innerHTML = `<div id="err">Couldn't access the camera.<br>Check your browser's camera permission and try again.</div>
        <div class="topbar"><div class="pill" id="back2">← Menu</div><div></div></div>`;
      document.getElementById('back2').onclick = closeCamera;
      return;
    }
  }
  video.srcObject = stream;
  startLevel();
}

function closeCamera(){
  camEl.classList.remove('active');
  menuEl.classList.add('active');
  window.removeEventListener('deviceorientation', onTilt);
}
document.getElementById('back').onclick = closeCamera;

const previewEl = document.getElementById('preview');
const shotImg = document.getElementById('shotImg');
const saveBtn = document.getElementById('saveBtn');

document.getElementById('shutterBtn').onclick = () => {
  const vw = video.videoWidth, vh = video.videoHeight;
  if(!vw || !vh) return;
  const dw = camEl.clientWidth, dh = camEl.clientHeight;
  // match object-fit:cover cropping so the photo matches what's on screen
  const scale = Math.max(dw/vw, dh/vh);
  const sw = dw/scale, sh = dh/scale;
  const sx = (vw-sw)/2, sy = (vh-sh)/2;

  const out = document.createElement('canvas');
  out.width = dw; out.height = dh;
  const octx = out.getContext('2d');
  octx.drawImage(video, sx, sy, sw, sh, 0, 0, dw, dh);

  const url = out.toDataURL('image/jpeg', 0.92);
  shotImg.src = url;
  saveBtn.href = url;
  camEl.classList.remove('active');
  previewEl.classList.add('active');
};

document.getElementById('retakeBtn').onclick = () => {
  previewEl.classList.remove('active');
  camEl.classList.add('active');
};

function onTilt(e){
  const liveLine = document.getElementById('liveLine');
  const label = document.getElementById('levelLabel');
  if(!liveLine) return;
  const roll = e.gamma || 0; // left-right tilt is what levels a horizon
  liveLine.setAttribute('transform', `rotate(${roll} 50 50)`);
  const level = Math.abs(roll) < 2.5;
  liveLine.setAttribute('stroke', level ? 'var(--good)' : 'var(--warn)');
  if(label){
    label.textContent = level ? 'Level — hold steady' : 'Tilt until the lines meet';
    label.style.color = level ? 'var(--good)' : 'var(--muted)';
  }
}

function startLevel(){
  const lv = document.getElementById('levelSvg');
  const label = document.getElementById('levelLabel');
  if(typeof DeviceOrientationEvent !== 'undefined'){
    lv.classList.add('on');
    label.classList.add('on');
    if(typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission().then(res=>{
        if(res === 'granted') window.addEventListener('deviceorientation', onTilt);
      }).catch(()=>{});
    } else {
      window.addEventListener('deviceorientation', onTilt);
    }
  }
}
</script>
</body>
</html>
