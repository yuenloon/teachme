<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#0b0f17" />
<title>Shot Coach</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0f17;color:#e6eaf2;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  .screen{position:fixed;inset:0;display:none}
  .screen.active{display:block}

  /* ---------- MENU ---------- */
  #menuScreen{overflow-y:auto;-webkit-overflow-scrolling:touch;
    background:radial-gradient(120% 90% at 50% 0%,#141a25 0%,#0b0f17 60%)}
  .menu-wrap{padding:calc(env(safe-area-inset-top) + 34px) 20px calc(env(safe-area-inset-bottom) + 34px)}
  .menu-wrap h1{margin:0 0 8px;font-size:26px;line-height:1.15;letter-spacing:-.4px;color:#fff}
  .menu-wrap .sub{margin:0 0 6px;font-size:14px;line-height:1.45;color:#8892a6;max-width:34ch}
  .menu-wrap .kicker{font-size:11px;font-weight:600;letter-spacing:2px;
    text-transform:uppercase;color:#60a5fa;margin:0 0 12px;opacity:.9}

  /* Aspect ratio selector (menu) */
  .ratio-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-top:18px;padding:12px 14px;border-radius:14px;
    background:linear-gradient(180deg,#151b26 0%,#101620 100%);
    border:1px solid rgba(255,255,255,.06)}
  .ratio-row-label{font-size:12px;font-weight:600;letter-spacing:.4px;
    text-transform:uppercase;color:#8892a6}
  .ratio-seg{display:flex;gap:4px;padding:3px;border-radius:10px;
    background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06)}
  .ratio-seg button{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;
    color:#8892a6;transition:all .12s ease;letter-spacing:.3px}
  .ratio-seg button.active{background:#60a5fa;color:#0b0f17;
    box-shadow:0 0 12px rgba(96,165,250,.5)}
  .ratio-seg button:active{transform:scale(.95)}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
  @media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{display:flex;flex-direction:column;align-items:flex-start;gap:10px;
    padding:18px 16px 16px;border-radius:16px;
    background:linear-gradient(180deg,#151b26 0%,#101620 100%);
    border:1px solid rgba(255,255,255,.06);
    transition:transform .12s ease,background .12s ease,border-color .12s ease}
  .card:active{transform:scale(.965);background:#1a2231;border-color:rgba(96,165,250,.35)}
  .card .ico{font-size:24px;line-height:1}
  .card .lbl{font-size:15px;font-weight:600;letter-spacing:-.2px;color:#fff}
  .card .desc{font-size:12.5px;line-height:1.4;color:#7c869a;margin-top:2px}

  /* ---------- CAMERA ---------- */
  #camScreen{background:#000}
  #video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

  .topbar{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;
    justify-content:space-between;gap:10px;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent)}
  .icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
    background:rgba(0,0,0,.42);backdrop-filter:blur(8px);font-size:19px;
    border:1px solid rgba(255,255,255,.14);color:#fff;flex-shrink:0}
  .icon-btn:active{background:rgba(255,255,255,.18)}

  .chip-group{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;overflow:hidden}
  .mode-chip{font-size:11.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
    padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.42);
    backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);color:#fff;
    white-space:nowrap}
  .ratio-chip{font-size:12px;font-weight:700;letter-spacing:.4px;
    padding:8px 12px;border-radius:999px;
    background:rgba(96,165,250,.22);backdrop-filter:blur(8px);
    border:1px solid rgba(96,165,250,.55);color:#bfdbfe;
    white-space:nowrap;transition:transform .1s ease}
  .ratio-chip:active{transform:scale(.94);background:rgba(96,165,250,.35)}

  .status{position:absolute;top:calc(env(safe-area-inset-top) + 66px);left:50%;
    transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:8px;
    padding:8px 16px;border-radius:999px;font-size:12.5px;font-weight:600;
    letter-spacing:.4px;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.14);white-space:nowrap;color:#e6eaf2;
    transition:background .2s,border-color .2s;max-width:70vw;overflow:hidden;text-overflow:ellipsis}
  .status .dot{width:8px;height:8px;border-radius:50%;background:#fff;transition:background .2s;flex-shrink:0}
  .status.ok{background:rgba(96,165,250,.22);border-color:rgba(96,165,250,.7)}
  .status.ok .dot{background:#60a5fa;box-shadow:0 0 12px #60a5fa}

  .bottombar{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;
    flex-direction:column;align-items:center;gap:14px;
    padding:26px 20px calc(env(safe-area-inset-bottom) + 26px);
    background:linear-gradient(to top,rgba(0,0,0,.72),transparent)}
  .tip{max-width:36ch;text-align:center;font-size:13px;line-height:1.5;color:#dde3ee;
    text-shadow:0 1px 6px rgba(0,0,0,.8)}
  .hint{font-size:11.5px;line-height:1.4;color:#8892a6;text-align:center;
    max-width:34ch;text-shadow:0 1px 4px rgba(0,0,0,.8);margin-top:-4px}
  .shutter{width:74px;height:74px;border-radius:50%;
    border:3px solid rgba(255,255,255,.9);
    display:grid;place-items:center;background:rgba(255,255,255,.12);transition:transform .1s}
  .shutter span{width:58px;height:58px;border-radius:50%;background:#fff;display:block}
  .shutter:active{transform:scale(.93)}
  .link-btn{font-size:12.5px;color:#60a5fa;text-decoration:underline;padding:4px 8px}

  .err{position:absolute;inset:auto 20px 50% 20px;z-index:5;padding:18px;border-radius:14px;
    background:#151b26;border:1px solid rgba(255,255,255,.12);font-size:14px;line-height:1.5;
    color:#cfd6e3;text-align:center}

  /* ---------- PREVIEW ---------- */
  #previewScreen{background:#000;flex-direction:column}
  #previewScreen.active{display:flex}
  #shotImg{flex:1;width:100%;min-height:0;object-fit:contain;background:#000}
  .preview-bar{display:flex;gap:12px;padding:16px 20px calc(env(safe-area-inset-bottom) + 20px)}
  .btn{flex:1;padding:15px;border-radius:12px;font-size:15px;font-weight:600;text-align:center;
    text-decoration:none;display:block}
  .btn.ghost{background:#1a2231;color:#fff;border:1px solid rgba(255,255,255,.08)}
  .btn.primary{background:#60a5fa;color:#0b0f17}
  .btn:active{opacity:.75}
</style>
</head>
<body>

<!-- ============ SCREEN 1 : MENU ============ -->
<div id="menuScreen" class="screen active">
  <div class="menu-wrap">
    <p class="kicker">Framing Guide</p>
    <h1>Find the spot, then shoot</h1>
    <p class="sub">Line up the person using the guides, then switch to your phone camera and match the same frame.</p>

    <div class="ratio-row">
      <span class="ratio-row-label">Frame ratio</span>
      <div class="ratio-seg" id="ratioSegMenu">
        <button data-ratio="9:16" class="active">9:16</button>
        <button data-ratio="3:4">3:4</button>
      </div>
    </div>

    <div class="grid" id="modeGrid"></div>
  </div>
</div>

<!-- ============ SCREEN 2 : CAMERA ============ -->
<div id="camScreen" class="screen">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="overlay"></canvas>

  <div class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="Back">✕</button>
    <div class="chip-group">
      <div class="mode-chip" id="modeLabel">Portrait</div>
      <button class="ratio-chip" id="ratioChip" aria-label="Cycle aspect ratio">9:16</button>
    </div>
    <button class="icon-btn" id="flipBtn" aria-label="Switch camera">⇄</button>
  </div>

  <div class="status" id="statusPill">
    <span class="dot"></span><span id="statusText">Enable motion for the tilt guide</span>
  </div>

  <div class="bottombar">
    <div class="tip" id="tipText"></div>
    <div class="hint" id="hintText">Match this frame in your phone camera app</div>
    <button class="shutter" id="shutterBtn" aria-label="Take photo"><span></span></button>
    <button class="link-btn" id="permBtn" hidden>Tap to enable the tilt guide</button>
  </div>

  <div class="err" id="errBox" hidden></div>
</div>

<!-- ============ SCREEN 3 : PREVIEW ============ -->
<div id="previewScreen" class="screen">
  <img id="shotImg" alt="Your photo" />
  <div class="preview-bar">
    <button class="btn ghost" id="retakeBtn">Retake</button>
    <a class="btn primary" id="saveBtn" download="photo.jpg">Save</a>
  </div>
</div>

<script>
/* =========================================================
   SHOT TYPES
   ========================================================= */
const MODES = {
  portrait: {
    label: 'Portrait', icon: '🧑', guide: 'lines',
    desc: 'Bust · 30% headroom',
    tip: 'Top 30% is empty headroom — keep it blank. Head top on the anchor line, eyes on the eye line, shoulders below. Waist is a safe crop.',
    targetRoll: 0, targetElevation: -5,
    bands: [ { y1: 0.00, y2: 0.30, label: 'HEADROOM · LEAVE BLANK', kind: 'blank' } ],
    lines: [
      { y: 0.30, label: 'HEAD TOP',           kind: 'anchor' },
      { y: 0.40, label: 'EYES — upper third', kind: 'key'    },
      { y: 0.55, label: 'SHOULDERS',          kind: 'key'    },
      { y: 0.90, label: 'WAIST · safe crop',  kind: 'safe'   }
    ]
  },
  selfie: {
    label: 'Selfie', icon: '🤳', guide: 'lines',
    desc: 'Solo · high angle, 30% headroom',
    tip: 'Hold the phone slightly above eye level. Leave the top band blank — head top on the anchor, eyes on the eye line.',
    targetRoll: 0, targetElevation: -14,
    bands: [ { y1: 0.00, y2: 0.30, label: 'HEADROOM · LEAVE BLANK', kind: 'blank' } ],
    lines: [
      { y: 0.30, label: 'HEAD TOP',           kind: 'anchor' },
      { y: 0.40, label: 'EYES — upper third', kind: 'key'    },
      { y: 0.54, label: 'SHOULDERS',          kind: 'key'    },
      { y: 0.86, label: 'WAIST · safe crop',  kind: 'safe'   }
    ]
  },
  halfBody: {
    label: 'Half body', icon: '🧍', guide: 'lines',
    desc: 'Waist up · 30% headroom',
    tip: 'Top 30% is headroom. Eyes on the eye line, shoulders below. Crop at the waist — never cut at the wrists.',
    targetRoll: 0, targetElevation: -2,
    bands: [ { y1: 0.00, y2: 0.30, label: 'HEADROOM · LEAVE BLANK', kind: 'blank' } ],
    lines: [
      { y: 0.30, label: 'HEAD TOP',            kind: 'anchor' },
      { y: 0.40, label: 'EYES — upper third',  kind: 'key'    },
      { y: 0.54, label: 'SHOULDERS',           kind: 'key'    },
      { y: 0.74, label: 'WRISTS · avoid crop', kind: 'avoid'  },
      { y: 0.94, label: 'WAIST · safe crop',   kind: 'safe'   }
    ]
  },
  closeUp: {
    label: 'Close-up', icon: '🙂', guide: 'circle',
    desc: 'Face fills the frame',
    tip: '20% headroom above the head. Eyes on the eye line — never crop at the chin. Chest is a safe crop.',
    targetRoll: 0, targetElevation: -8,
    bands: [ { y1: 0.00, y2: 0.20, label: 'HEADROOM · LEAVE BLANK', kind: 'blank' } ],
    lines: [
      { y: 0.20, label: 'HEAD TOP',           kind: 'anchor' },
      { y: 0.35, label: 'EYES',               kind: 'key'    },
      { y: 0.62, label: 'CHIN · avoid crop',  kind: 'avoid'  },
      { y: 0.85, label: 'CHEST · safe crop',  kind: 'safe'   }
    ]
  },
  group: {
    label: 'Group', icon: '👨‍👩‍👧', guide: 'lines',
    desc: 'Everyone in one eye line',
    tip: 'Top 30% is headroom — keep it blank. Align every face on the eye bar. Waist is a safe crop.',
    targetRoll: 0, targetElevation: -3,
    bands: [ { y1: 0.00, y2: 0.30, label: 'HEADROOM · LEAVE BLANK', kind: 'blank' } ],
    lines: [
      { y: 0.30, label: 'HEAD TOPS',              kind: 'anchor' },
      { y: 0.40, label: 'EYES — align all faces', kind: 'key'    },
      { y: 0.55, label: 'SHOULDERS',              kind: 'key'    },
      { y: 0.88, label: 'WAIST · safe crop',      kind: 'safe'   }
    ]
  },
  fullBody: {
    label: 'Full body', icon: '🕴️', guide: 'lines',
    desc: 'Head to toe · 30% headroom',
    tip: 'Top 30% is empty headroom — keep it blank for an airy, editorial look. Head top on the anchor. Never crop at knees or ankles.',
    targetRoll: 0, targetElevation: -2,
    bands: [ { y1: 0.00, y2: 0.30, label: 'HEADROOM · LEAVE BLANK', kind: 'blank' } ],
    lines: [
      { y: 0.30, label: 'HEAD TOP',             kind: 'anchor' },
      { y: 0.35, label: 'EYES',                 kind: 'key'    },
      { y: 0.43, label: 'SHOULDERS',            kind: 'key'    },
      { y: 0.56, label: 'WAIST · safe crop',    kind: 'safe'   },
      { y: 0.78, label: 'KNEES · avoid crop',   kind: 'avoid'  },
      { y: 0.92, label: 'ANKLES · avoid crop',  kind: 'avoid'  },
      { y: 0.96, label: 'FEET — leave floor',   kind: 'key'    }
    ]
  },
  landscape: {
    label: 'Landscape', icon: '🏔️', guide: 'landscape',
    desc: 'Scenic · level horizon',
    tip: 'Keep the horizon dead level. Put it on the upper or lower third depending on whether sky or land is the hero.',
    targetRoll: 0, targetElevation: -3,
    bands: [],
    lines: [
      { y: 0.33, label: 'UPPER THIRD · horizon', kind: 'key' },
      { y: 0.66, label: 'LOWER THIRD · horizon', kind: 'key' }
    ]
  },
  food: {
    label: 'Food', icon: '🍜', guide: 'food',
    desc: '45° or overhead',
    tip: 'Shoot at 45° for layered dishes, or straight overhead for a flat-lay. Soft side light — never flash.',
    targetRoll: 0, targetElevation: -45,
    bands: [], lines: []
  }
};

/* =========================================================
   ELEMENTS / STATE
   ========================================================= */
const menuScreen    = document.getElementById('menuScreen');
const camScreen     = document.getElementById('camScreen');
const previewScreen = document.getElementById('previewScreen');
const video         = document.getElementById('video');
const overlay       = document.getElementById('overlay');
const modeGrid      = document.getElementById('modeGrid');
const modeLabel     = document.getElementById('modeLabel');
const tipText       = document.getElementById('tipText');
const errBox        = document.getElementById('errBox');
const permBtn       = document.getElementById('permBtn');
const shotImg       = document.getElementById('shotImg');
const saveBtn       = document.getElementById('saveBtn');
const statusPill    = document.getElementById('statusPill');
const statusText    = document.getElementById('statusText');
const ratioChip     = document.getElementById('ratioChip');
const ratioSegMenu  = document.getElementById('ratioSegMenu');

let currentMode   = null;
let currentRatio  = '9:16';   // '9:16' | '3:4'
let stream        = null;
let facingMode    = 'environment';
let rollCW        = 0;
let elevation     = 0;
let tiltActive    = false;
let tiltAttached  = false;
let rafId         = null;

/* =========================================================
   RATIO
   ========================================================= */
function setRatio(r) {
  currentRatio = r;
  ratioChip.textContent = r;
  ratioSegMenu.querySelectorAll('button').forEach(b =>
    b.classList.toggle('active', b.dataset.ratio === r)
  );
}

ratioChip.addEventListener('click', () => {
  setRatio(currentRatio === '9:16' ? '3:4' : '9:16');
});

ratioSegMenu.querySelectorAll('button').forEach(b => {
  b.addEventListener('click', () => setRatio(b.dataset.ratio));
});

/* Given the canvas w×h and desired aspect (width/height, portrait),
   return the rectangle the photo will actually cover, centred. */
function getFrame(w, h, ratio) {
  const target = ratio === '3:4' ? 3 / 4 : 9 / 16;
  let fw, fh;
  if (w / h > target) {
    // canvas wider than target → pillarbox
    fh = h; fw = h * target;
  } else {
    // canvas taller/narrower → letterbox
    fw = w; fh = w / target;
  }
  return { x: (w - fw) / 2, y: (h - fh) / 2, w: fw, h: fh };
}

/* =========================================================
   MENU
   ========================================================= */
Object.entries(MODES).forEach(([key, m]) => {
  const b = document.createElement('button');
  b.className = 'card';
  b.innerHTML = `<span class="ico">${m.icon}</span>
                 <span class="lbl">${m.label}</span>
                 <span class="desc">${m.desc}</span>`;
  b.addEventListener('click', () => selectMode(key));
  modeGrid.appendChild(b);
});

function showScreen(id) {
  [menuScreen, camScreen, previewScreen].forEach(s =>
    s.classList.toggle('active', s.id === id)
  );
}

async function selectMode(key) {
  currentMode = key;
  modeLabel.textContent = MODES[key].label;
  tipText.textContent = MODES[key].tip;
  showScreen('camScreen');

  try {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('portrait').catch(() => {});
    }
  } catch (e) {}

  const ok = await requestTiltPermission();
  permBtn.hidden = ok;
  if (ok) attachTilt();

  startCamera();
  startLoop();
}

/* =========================================================
   CAMERA
   ========================================================= */
async function startCamera() {
  stopCamera();
  errBox.hidden = true;

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError('This browser can’t access the camera here. Open the page over <b>https://</b> or <b>localhost</b>, and allow camera access.');
    return;
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: facingMode }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    video.srcObject = stream;
    video.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'none';
    await video.play();
  } catch (err) {
    showError(
      err && err.name === 'NotAllowedError'
        ? 'Camera permission was denied. Allow it in your browser settings and reload.'
        : 'Could not start the camera.<br><small>' + (err && err.message ? err.message : err) + '</small>'
    );
  }
}

function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
}

function showError(html) { errBox.innerHTML = html; errBox.hidden = false; }

/* =========================================================
   TILT / LEVEL
   ========================================================= */
async function requestTiltPermission() {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try { return (await DeviceOrientationEvent.requestPermission()) === 'granted'; }
    catch (e) { return false; }
  }
  return typeof DeviceOrientationEvent !== 'undefined';
}

function getScreenAngle() {
  if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
  if (typeof window.orientation === 'number') return window.orientation;
  return 0;
}

function attachTilt() {
  if (tiltAttached) return;
  tiltAttached = true;

  window.addEventListener('deviceorientation', (e) => {
    if (e.beta == null || e.gamma == null) return;
    const b = e.beta * Math.PI / 180;
    const g = e.gamma * Math.PI / 180;
    const t = getScreenAngle() * Math.PI / 180;

    const gx = -Math.cos(b) * Math.sin(g);
    const gy = -Math.sin(b);
    const gz = -Math.cos(b) * Math.cos(g);

    const gRight =  gx * Math.cos(t) - gy * Math.sin(t);
    const gDown  =  gx * Math.sin(t) + gy * Math.cos(t);

    rollCW    = Math.atan2(gRight, gDown) * 180 / Math.PI;
    elevation = Math.asin(Math.max(-1, Math.min(1, gz))) * 180 / Math.PI;
    tiltActive = true;
  }, true);
}

permBtn.addEventListener('click', async () => {
  const ok = await requestTiltPermission();
  if (ok) { attachTilt(); permBtn.hidden = true; }
});

/* =========================================================
   OVERLAY RENDERING
   ========================================================= */
function startLoop() {
  if (rafId) return;
  const loop = () => { drawOverlay(); rafId = requestAnimationFrame(loop); };
  rafId = requestAnimationFrame(loop);
}
function stopLoop() { if (rafId) cancelAnimationFrame(rafId); rafId = null; }

function drawOverlay() {
  const w = overlay.clientWidth, h = overlay.clientHeight;
  if (!w || !h) return;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (overlay.width !== Math.round(w * dpr) || overlay.height !== Math.round(h * dpr)) {
    overlay.width  = Math.round(w * dpr);
    overlay.height = Math.round(h * dpr);
  }
  const ctx = overlay.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const m = MODES[currentMode];
  if (!m) return;

  const frame = getFrame(w, h, currentRatio);

  // Dim outside the frame, then draw the crisp frame border + corner marks
  drawFrameMask(ctx, w, h, frame);

  // All guides drawn inside the frame
  drawGrid(ctx, frame);
  (m.bands || []).forEach(b => drawBand(ctx, frame, b));
  (m.lines || []).forEach(l => drawRefLine(ctx, frame, l));

  if (m.guide === 'circle') drawCircle(ctx, frame, 0.50, 0.50, 0.34);
  if (m.guide === 'food')   drawCircle(ctx, frame, 0.50, 0.47, 0.32);

  const rollAligned = tiltActive && Math.abs(rollCW - m.targetRoll) < 2;
  if (m.guide === 'landscape') {
    drawHorizonLine(ctx, frame, m.targetRoll, rollAligned);
  }

  // Pitch meter stays at screen edge (it's UI, not part of the frame)
  drawPitchMeter(ctx, w, h, m.targetElevation);
  updateStatus(m, rollAligned);
}

/* ---- helpers ---- */
function line(ctx, x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}
function tag(ctx, text, x, y, color, align, size) {
  ctx.save();
  ctx.font = `600 ${size || 10.5}px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,.95)';
  ctx.shadowBlur = 6;
  ctx.fillText(text, x, y);
  ctx.restore();
}

/* =========================================================
   FRAME MASK  — dims outside the photo area
   ========================================================= */
function drawFrameMask(ctx, w, h, f) {
  ctx.save();

  // Dim everything outside the frame
  ctx.fillStyle = 'rgba(0,0,0,.58)';
  ctx.fillRect(0, 0, w, f.y);                                  // top
  ctx.fillRect(0, f.y + f.h, w, h - f.y - f.h);                // bottom
  ctx.fillRect(0, f.y, f.x, f.h);                              // left
  ctx.fillRect(f.x + f.w, f.y, w - f.x - f.w, f.h);            // right

  // Thin frame border
  ctx.strokeStyle = 'rgba(255,255,255,.42)';
  ctx.lineWidth = 1;
  ctx.strokeRect(f.x + 0.5, f.y + 0.5, f.w - 1, f.h - 1);

  // Corner marks (blue) — clear visual anchor for the frame
  const cm = 22;
  ctx.strokeStyle = 'rgba(96,165,250,.95)';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'square';
  ctx.shadowColor = 'rgba(96,165,250,.6)';
  ctx.shadowBlur = 6;

  const corners = [
    [f.x,         f.y,         1,  1],
    [f.x + f.w,   f.y,        -1,  1],
    [f.x,         f.y + f.h,   1, -1],
    [f.x + f.w,   f.y + f.h,  -1, -1]
  ];
  corners.forEach(([x, y, sx, sy]) => {
    ctx.beginPath();
    ctx.moveTo(x + sx * cm, y);
    ctx.lineTo(x, y);
    ctx.lineTo(x, y + sy * cm);
    ctx.stroke();
  });

  // Tiny ratio label at top-left inside the frame
  ctx.font = '700 10.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
  ctx.fillStyle = 'rgba(191,219,254,.95)';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.shadowColor = 'rgba(0,0,0,.95)';
  ctx.shadowBlur = 5;
  ctx.fillText(currentRatio, f.x + 10, f.y + 10);

  ctx.restore();
}

/* =========================================================
   GRID (inside frame)
   ========================================================= */
function drawGrid(ctx, f) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.10)';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 7]);
  ctx.beginPath();
  for (let i = 1; i < 3; i++) {
    ctx.moveTo(f.x + f.w * i / 3, f.y);
    ctx.lineTo(f.x + f.w * i / 3, f.y + f.h);
    ctx.moveTo(f.x, f.y + f.h * i / 3);
    ctx.lineTo(f.x + f.w, f.y + f.h * i / 3);
  }
  ctx.stroke();
  ctx.restore();
}

/* =========================================================
   SHADED BAND (inside frame)
   ========================================================= */
function drawBand(ctx, f, def) {
  const y1 = f.y + f.h * def.y1;
  const y2 = f.y + f.h * def.y2;
  const bandH = y2 - y1;
  if (bandH <= 0) return;

  ctx.save();

  const grad = ctx.createLinearGradient(0, y1, 0, y2);
  if (def.kind === 'safe') {
    grad.addColorStop(0, 'rgba(34,197,94,.16)');
    grad.addColorStop(1, 'rgba(34,197,94,.04)');
  } else if (def.kind === 'avoid') {
    grad.addColorStop(0, 'rgba(239,68,68,.16)');
    grad.addColorStop(1, 'rgba(239,68,68,.04)');
  } else {
    grad.addColorStop(0, 'rgba(255,255,255,.11)');
    grad.addColorStop(1, 'rgba(255,255,255,.03)');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(f.x, y1, f.w, bandH);

  // Faint diagonal hatch
  ctx.save();
  ctx.beginPath();
  ctx.rect(f.x, y1, f.w, bandH);
  ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,.05)';
  ctx.lineWidth = 1;
  const step = 18;
  for (let x = f.x - bandH; x < f.x + f.w + bandH; x += step) {
    ctx.beginPath();
    ctx.moveTo(x, y1);
    ctx.lineTo(x + bandH, y2);
    ctx.stroke();
  }
  ctx.restore();

  const labelY = y1 + bandH * 0.5;
  const labelColor =
    def.kind === 'safe'  ? '#86efac' :
    def.kind === 'avoid' ? '#fca5a5' :
                            'rgba(255,255,255,.85)';
  tag(ctx, def.label, f.x + f.w / 2, labelY, labelColor, 'center', 11);

  ctx.restore();
}

/* =========================================================
   REFERENCE LINE (inside frame)
   ========================================================= */
function drawRefLine(ctx, f, def) {
  const y = f.y + f.h * def.y;

  let stroke, label, dash, thickness;
  if (def.kind === 'anchor') {
    stroke = 'rgba(255,255,255,.88)';
    label = 'rgba(255,255,255,.98)';
    dash = [];
    thickness = 1.7;
  } else if (def.kind === 'safe') {
    stroke = 'rgba(34,197,94,.88)';
    label = '#86efac';
    dash = [8, 6];
    thickness = 1.5;
  } else if (def.kind === 'avoid') {
    stroke = 'rgba(239,68,68,.88)';
    label = '#fca5a5';
    dash = [6, 5];
    thickness = 1.5;
  } else {
    stroke = 'rgba(255,255,255,.78)';
    label = 'rgba(255,255,255,.95)';
    dash = [8, 6];
    thickness = 1.3;
  }

  ctx.save();
  ctx.setLineDash(dash);
  ctx.strokeStyle = stroke;
  ctx.lineWidth = thickness;
  ctx.shadowColor = 'rgba(0,0,0,.7)';
  ctx.shadowBlur = 4;
  ctx.beginPath();
  ctx.moveTo(f.x, y);
  ctx.lineTo(f.x + f.w, y);
  ctx.stroke();

  // end ticks
  ctx.setLineDash([]);
  ctx.lineWidth = thickness + 0.4;
  ctx.beginPath();
  ctx.moveTo(f.x + 8, y - 4);         ctx.lineTo(f.x + 8, y + 4);
  ctx.moveTo(f.x + f.w - 8, y - 4);   ctx.lineTo(f.x + f.w - 8, y + 4);
  ctx.stroke();

  // label pill inside the frame, left-aligned
  ctx.font = '600 10.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
  const textW = ctx.measureText(def.label).width;
  const padX = 7, pillH = 16;
  const bx = f.x + 16;
  const by = y - pillH / 2;

  roundRect(ctx, bx - 1, by, textW + padX * 2, pillH, 8);
  ctx.fillStyle = 'rgba(0,0,0,.58)';
  ctx.fill();

  ctx.fillStyle = label;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,.9)';
  ctx.shadowBlur = 4;
  ctx.fillText(def.label, bx + padX, y);

  ctx.restore();
}

/* =========================================================
   HORIZON LEVEL LINE (inside frame)
   ========================================================= */
function drawHorizonLine(ctx, f, targetRoll, aligned) {
  const cx = f.x + f.w / 2;
  const cy = f.y + f.h * 0.52;
  const half = Math.hypot(f.w, f.h) * 0.62;
  const tint = aligned ? '96,165,250' : '255,255,255';
  const baseAlpha = aligned ? 0.90 : 0.55;

  // dashed ghost
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(targetRoll * Math.PI / 180);
  ctx.setLineDash([16, 14]);
  ctx.lineWidth = 1.3;
  ctx.strokeStyle = aligned ? 'rgba(96,165,250,0.30)' : 'rgba(255,255,255,0.20)';
  ctx.beginPath();
  ctx.moveTo(-half, 0); ctx.lineTo(half, 0);
  ctx.stroke();
  ctx.restore();

  // live line
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate((tiltActive ? rollCW : targetRoll) * Math.PI / 180);
  const grad = ctx.createLinearGradient(-half, 0, half, 0);
  grad.addColorStop(0.00, `rgba(${tint},0)`);
  grad.addColorStop(0.18, `rgba(${tint},${baseAlpha})`);
  grad.addColorStop(0.82, `rgba(${tint},${baseAlpha})`);
  grad.addColorStop(1.00, `rgba(${tint},0)`);
  ctx.shadowColor = aligned ? 'rgba(96,165,250,0.9)' : 'rgba(255,255,255,0.5)';
  ctx.shadowBlur  = aligned ? 20 : 9;
  ctx.lineWidth   = aligned ? 2.6 : 2;
  ctx.strokeStyle = grad;
  ctx.beginPath();
  ctx.moveTo(-half, 0); ctx.lineTo(half, 0);
  ctx.stroke();
  ctx.restore();

  // centre tick
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate((tiltActive ? rollCW : targetRoll) * Math.PI / 180);
  ctx.beginPath();
  ctx.arc(0, 0, 4.5, 0, Math.PI * 2);
  ctx.fillStyle = aligned ? '#60a5fa' : 'rgba(255,255,255,.9)';
  ctx.shadowColor = 'rgba(0,0,0,.8)';
  ctx.shadowBlur = 7;
  ctx.fill();
  ctx.restore();
}

/* =========================================================
   PITCH METER (screen-fixed)
   ========================================================= */
function drawPitchMeter(ctx, w, h, target) {
  const range = 60;
  const barH  = Math.min(h * 0.36, 220);
  const barW  = 6;
  const x     = w - 22;
  const cy    = h * 0.50;
  const top   = cy - barH / 2;

  const map = v => {
    const c = Math.max(-range, Math.min(range, v));
    return top + barH / 2 - (c / range) * (barH / 2);
  };

  ctx.save();
  roundRect(ctx, x - barW / 2, top, barW, barH, barW / 2);
  ctx.fillStyle = 'rgba(0,0,0,.42)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.20)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();

  const ty = map(target);
  ctx.save();
  ctx.strokeStyle = '#60a5fa';
  ctx.lineWidth = 2;
  ctx.shadowColor = 'rgba(96,165,250,.85)';
  ctx.shadowBlur = 9;
  ctx.beginPath();
  ctx.moveTo(x - 11, ty); ctx.lineTo(x + 11, ty);
  ctx.stroke();
  ctx.restore();

  const iy = map(tiltActive ? elevation : target);
  const ok = tiltActive && Math.abs(elevation - target) < 3;
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, iy, 6.5, 0, Math.PI * 2);
  ctx.fillStyle = ok ? '#60a5fa' : '#ffffff';
  ctx.shadowColor = ok ? 'rgba(96,165,250,.95)' : 'rgba(0,0,0,.7)';
  ctx.shadowBlur = 9;
  ctx.fill();
  ctx.restore();

  tag(ctx, 'UP',   x, top - 10, 'rgba(255,255,255,.45)');
  tag(ctx, 'DOWN', x, top + barH + 16, 'rgba(255,255,255,.45)');

  if (tiltActive) {
    const diff = target - elevation;
    if (Math.abs(diff) >= 3) {
      const dir = diff < 0 ? 'DOWN' : 'UP';
      tag(ctx, `TILT ${dir} ${Math.abs(diff).toFixed(0)}°`, x - 12, top - 10, '#e6eaf2', 'right');
    } else {
      tag(ctx, 'ANGLE ✓', x - 12, top - 10, '#60a5fa', 'right');
    }
  }
}

/* =========================================================
   CIRCLE (inside frame)
   ========================================================= */
function drawCircle(ctx, f, cxF, cyF, rF) {
  ctx.save();
  const cx = f.x + f.w * cxF;
  const cy = f.y + f.h * cyF;
  const r = Math.min(f.w, f.h) * rF;

  ctx.strokeStyle = 'rgba(255,255,255,.78)';
  ctx.lineWidth = 1.6;
  ctx.setLineDash([8, 7]);
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();

  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(255,255,255,.4)';
  ctx.lineWidth = 1.2;
  const t = r * 0.14;
  line(ctx, cx - t, cy, cx + t, cy);
  line(ctx, cx, cy - t, cx, cy + t);
  ctx.restore();
}

/* =========================================================
   STATUS PILL
   ========================================================= */
function updateStatus(m, rollAligned) {
  if (!tiltActive) {
    statusPill.classList.remove('ok');
    statusText.textContent = 'Motion off — tilt guide inactive';
    return;
  }
  const pitchOk = Math.abs(elevation - m.targetElevation) < 3;
  if (rollAligned && pitchOk) {
    statusPill.classList.add('ok');
    statusText.textContent = 'Ready to shoot';
  } else {
    statusPill.classList.remove('ok');
    if (!rollAligned) {
      statusText.textContent = `Tilt ${Math.abs(rollCW).toFixed(0)}° to level`;
    } else {
      const diff = m.targetElevation - elevation;
      statusText.textContent = `Angle phone ${diff < 0 ? 'down' : 'up'} ${Math.abs(diff).toFixed(0)}°`;
    }
  }
}

/* =========================================================
   CAPTURE  — crops to the chosen ratio
   ========================================================= */
document.getElementById('shutterBtn').addEventListener('click', capture);

function capture() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;

  const dw = camScreen.clientWidth, dh = camScreen.clientHeight;
  const scale = Math.max(dw / vw, dh / vh);
  const offsetX = (dw - vw * scale) / 2;
  const offsetY = (dh - vh * scale) / 2;

  const frame = getFrame(dw, dh, currentRatio);

  // Convert screen-frame to video coords
  const vfx = (frame.x - offsetX) / scale;
  const vfy = (frame.y - offsetY) / scale;
  const vfw = frame.w / scale;
  const vfh = frame.h / scale;

  const out = document.createElement('canvas');
  out.width  = Math.round(vfw);
  out.height = Math.round(vfh);

  const octx = out.getContext('2d');
  if (facingMode === 'user') {
    octx.translate(out.width, 0);
    octx.scale(-1, 1);
  }
  octx.drawImage(video, vfx, vfy, vfw, vfh, 0, 0, out.width, out.height);

  const url = out.toDataURL('image/jpeg', 0.92);
  shotImg.src = url;
  saveBtn.href = url;
  showScreen('previewScreen');
}

/* =========================================================
   NAVIGATION
   ========================================================= */
document.getElementById('backBtn').addEventListener('click', () => {
  stopCamera(); stopLoop();
  currentMode = null;
  showScreen('menuScreen');
});
document.getElementById('flipBtn').addEventListener('click', () => {
  facingMode = (facingMode === 'environment') ? 'user' : 'environment';
  startCamera();
});
document.getElementById('retakeBtn').addEventListener('click', () => {
  showScreen('camScreen'); startLoop();
});
window.addEventListener('orientationchange', () => setTimeout(drawOverlay, 250));
window.addEventListener('resize', drawOverlay);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopLoop();
  else if (camScreen.classList.contains('active')) startLoop();
});
</script>
