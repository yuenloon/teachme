<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0d" />
<title>Korean Shot Coach</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0b0d;color:#fff5e6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  .screen{position:fixed;inset:0;display:none}
  .screen.active{display:block}

  /* ---------- MENU ---------- */
  #menuScreen{overflow-y:auto;-webkit-overflow-scrolling:touch;
    background:radial-gradient(120% 90% at 50% 0%,#1e1a1f 0%,#0d0a0d 60%)}
  .menu-wrap{padding:calc(env(safe-area-inset-top) + 34px) 20px calc(env(safe-area-inset-bottom) + 34px)}
  .menu-wrap h1{margin:0 0 8px;font-size:27px;line-height:1.15;letter-spacing:-.4px;
    color:#ffe6ee}
  .menu-wrap .sub{margin:0 0 6px;font-size:14.5px;line-height:1.45;color:#c9b8bd;max-width:32ch}
  .menu-wrap .kicker{font-size:11px;font-weight:600;letter-spacing:2px;
    text-transform:uppercase;color:#f7b8c4;margin:0 0 14px;opacity:.9}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}
  @media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{display:flex;flex-direction:column;align-items:flex-start;gap:10px;
    padding:18px 16px 16px;border-radius:18px;
    background:linear-gradient(180deg,#221a20 0%,#1a141a 100%);
    border:1px solid rgba(247,184,196,.10);
    transition:transform .12s ease,background .12s ease,border-color .12s ease}
  .card:active{transform:scale(.965);background:#2a1f26;border-color:rgba(247,184,196,.3)}
  .card .ico{font-size:26px;line-height:1}
  .card .lbl{font-size:15px;font-weight:600;letter-spacing:-.2px;color:#ffe6ee}
  .card .desc{font-size:12.5px;line-height:1.4;color:#9d8d93;margin-top:2px}

  /* ---------- CAMERA ---------- */
  #camScreen{background:#000}
  #video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

  .topbar{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;
    justify-content:space-between;gap:12px;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent)}
  .icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
    background:rgba(0,0,0,.4);backdrop-filter:blur(8px);font-size:19px;
    border:1px solid rgba(247,184,196,.22);color:#ffe6ee}
  .icon-btn:active{background:rgba(247,184,196,.18)}
  .mode-chip{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;
    padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.42);
    backdrop-filter:blur(8px);border:1px solid rgba(247,184,196,.25);color:#ffe6ee}

  .status{position:absolute;top:calc(env(safe-area-inset-top) + 66px);left:50%;
    transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:8px;
    padding:8px 16px;border-radius:999px;font-size:12.5px;font-weight:600;
    letter-spacing:.4px;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);
    border:1px solid rgba(247,184,196,.22);white-space:nowrap;color:#ffe6ee;
    transition:background .2s,border-color .2s}
  .status .dot{width:8px;height:8px;border-radius:50%;background:#ffe6ee;transition:background .2s}
  .status.ok{background:rgba(247,184,196,.22);border-color:rgba(247,184,196,.65)}
  .status.ok .dot{background:#f7b8c4;box-shadow:0 0 12px #f7b8c4}

  .bottombar{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;
    flex-direction:column;align-items:center;gap:16px;
    padding:26px 20px calc(env(safe-area-inset-bottom) + 26px);
    background:linear-gradient(to top,rgba(0,0,0,.72),transparent)}
  .tip{max-width:34ch;text-align:center;font-size:13.5px;line-height:1.5;color:#f4e5ea;
    text-shadow:0 1px 6px rgba(0,0,0,.8)}
  .shutter{width:74px;height:74px;border-radius:50%;
    border:3px solid rgba(247,184,196,.9);
    display:grid;place-items:center;background:rgba(247,184,196,.14);transition:transform .1s}
  .shutter span{width:58px;height:58px;border-radius:50%;background:#ffe6ee;display:block}
  .shutter:active{transform:scale(.93)}
  .link-btn{font-size:12.5px;color:#f7b8c4;text-decoration:underline;padding:4px 8px}

  .err{position:absolute;inset:auto 20px 50% 20px;z-index:5;padding:18px;border-radius:16px;
    background:#1b1b21;border:1px solid rgba(247,184,196,.18);font-size:14px;line-height:1.5;
    color:#e8d8dd;text-align:center}

  /* ---------- PREVIEW ---------- */
  #previewScreen{background:#000;flex-direction:column}
  #previewScreen.active{display:flex}
  #shotImg{flex:1;width:100%;min-height:0;object-fit:contain;background:#000}
  .preview-bar{display:flex;gap:12px;padding:16px 20px calc(env(safe-area-inset-bottom) + 20px)}
  .btn{flex:1;padding:15px;border-radius:14px;font-size:15px;font-weight:600;text-align:center;
    text-decoration:none;display:block}
  .btn.ghost{background:#221a20;color:#ffe6ee;border:1px solid rgba(247,184,196,.2)}
  .btn.primary{background:#f7b8c4;color:#1a1016}
  .btn:active{opacity:.75}
</style>
</head>
<body>

<!-- ============ SCREEN 1 : MENU ============ -->
<div id="menuScreen" class="screen active">
  <div class="menu-wrap">
    <p class="kicker">🌸 Korean Aesthetic</p>
    <h1>Korean Shot Coach</h1>
    <p class="sub">Soft light, centered frames, gentle mood — pick a shot type and I'll show a soft figure line where the person should stand.</p>
    <div class="grid" id="modeGrid"></div>
  </div>
</div>

<!-- ============ SCREEN 2 : CAMERA ============ -->
<div id="camScreen" class="screen">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="overlay"></canvas>

  <div class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="Back">✕</button>
    <div class="mode-chip" id="modeLabel">Portrait</div>
    <button class="icon-btn" id="flipBtn" aria-label="Switch camera">⇄</button>
  </div>

  <div class="status" id="statusPill">
    <span class="dot"></span><span id="statusText">Enable motion for the tilt guide</span>
  </div>

  <div class="bottombar">
    <div class="tip" id="tipText"></div>
    <button class="shutter" id="shutterBtn" aria-label="Take photo"><span></span></button>
    <button class="link-btn" id="permBtn" hidden>Tap to enable the tilt guide</button>
  </div>

  <div class="err" id="errBox" hidden></div>
</div>

<!-- ============ SCREEN 3 : PREVIEW ============ -->
<div id="previewScreen" class="screen">
  <img id="shotImg" alt="Your photo" />
  <div class="preview-bar">
    <button class="btn ghost" id="retakeBtn">Retake</button>
    <a class="btn primary" id="saveBtn" download="photo.jpg">Save</a>
  </div>
</div>

<script>
/* =========================================================
   KOREAN-STYLE SHOT TYPES
   Each mode can carry a `figure` block describing the
   "shallow line" pose guide:
     type  : 'single' | 'cluster'
     pose  : 'bust'   | 'full'
     headCy: head centre as fraction of screen height
     headR : head radius as fraction of screen width
   ========================================================= */
const MODES = {
  portrait: {
    label: 'Portrait', icon: '🌸', guide: 'portrait',
    desc: 'Bust guide · centered',
    tip: 'Line the person up with the soft figure. Head in the upper third, body angled ~30° with the face turned back. Soft window light — no harsh sun.',
    targetRoll: 0, targetElevation: -5,
    figure: { type: 'single', pose: 'bust', headCy: 0.30, headR: 0.078 }
  },
  landscape: {
    label: 'Landscape', icon: '🌷', guide: 'landscape',
    desc: 'Pastel skies & minimal scenes',
    tip: 'Shoot at golden hour or on an overcast day for soft pastel skies. Keep the horizon dead level and frame something minimal.',
    targetRoll: 0, targetElevation: -3,
    figure: null
  },
  selfie: {
    label: 'Selfie', icon: '🎀', guide: 'selfie',
    desc: 'Ulzzang · small face, high angle',
    tip: 'Hold the phone at arm’s length, slightly above eye level. Keep your face small with lots of headroom, angle ~20° to one side, chin slightly down.',
    targetRoll: 0, targetElevation: -14,
    figure: { type: 'single', pose: 'bust', headCy: 0.27, headR: 0.066 }
  },
  group: {
    label: 'Group', icon: '💗', guide: 'group',
    desc: 'Loose cluster · warm light',
    tip: 'Cluster into the three figure guides — heads at different heights, faces close together. Warm even light (café, sunset, overcast).',
    targetRoll: 0, targetElevation: -3,
    figure: { type: 'cluster', pose: 'bust', headCy: 0.33, headR: 0.050 }
  },
  closeup: {
    label: 'Close-up', icon: '🌼', guide: 'circle',
    desc: 'Soft details & textures',
    tip: 'Fill the circle with your subject — flowers, coffee, hands, fabric. Soft light behind or beside it for a dreamy glow.',
    targetRoll: 0, targetElevation: -8,
    figure: null
  },
  food: {
    label: 'Food', icon: '🍰', guide: 'food',
    desc: 'Café flat-lay / 45° aesthetics',
    tip: 'Café style — 45° for layered dishes, or straight overhead for a flat-lay. Soft window light from the side, lifestyle surroundings.',
    targetRoll: 0, targetElevation: -45,
    figure: null
  },
  fullbody: {
    label: 'Full body', icon: '👗', guide: 'full',
    desc: 'Full silhouette · street style',
    tip: 'Line the person up with the full figure — head near the top, feet near the bottom. Phone at chest height, neutral background, relaxed mid-walk pose.',
    targetRoll: 0, targetElevation: -2,
    figure: { type: 'single', pose: 'full', headCy: 0.155, headR: 0.042 }
  }
};

/* =========================================================
   ELEMENTS / STATE
   ========================================================= */
const menuScreen    = document.getElementById('menuScreen');
const camScreen     = document.getElementById('camScreen');
const previewScreen = document.getElementById('previewScreen');
const video         = document.getElementById('video');
const overlay       = document.getElementById('overlay');
const modeGrid      = document.getElementById('modeGrid');
const modeLabel     = document.getElementById('modeLabel');
const tipText       = document.getElementById('tipText');
const errBox        = document.getElementById('errBox');
const permBtn       = document.getElementById('permBtn');
const shotImg       = document.getElementById('shotImg');
const saveBtn       = document.getElementById('saveBtn');
const statusPill    = document.getElementById('statusPill');
const statusText    = document.getElementById('statusText');

let currentMode   = null;
let stream        = null;
let facingMode    = 'environment';
let rollCW        = 0;
let elevation     = 0;
let tiltActive    = false;
let tiltAttached  = false;
let rafId         = null;

/* =========================================================
   MENU
   ========================================================= */
Object.entries(MODES).forEach(([key, m]) => {
  const b = document.createElement('button');
  b.className = 'card';
  b.innerHTML = `<span class="ico">${m.icon}</span>
                 <span class="lbl">${m.label}</span>
                 <span class="desc">${m.desc}</span>`;
  b.addEventListener('click', () => selectMode(key));
  modeGrid.appendChild(b);
});

function showScreen(id) {
  [menuScreen, camScreen, previewScreen].forEach(s =>
    s.classList.toggle('active', s.id === id)
  );
}

async function selectMode(key) {
  currentMode = key;
  modeLabel.textContent = MODES[key].label;
  tipText.textContent = MODES[key].tip;
  showScreen('camScreen');

  try {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('portrait').catch(() => {});
    }
  } catch (e) {}

  const ok = await requestTiltPermission();
  permBtn.hidden = ok;
  if (ok) attachTilt();

  startCamera();
  startLoop();
}

/* =========================================================
   CAMERA
   ========================================================= */
async function startCamera() {
  stopCamera();
  errBox.hidden = true;

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError('This browser can’t access the camera here. Open the page over <b>https://</b> or <b>localhost</b>, and allow camera access.');
    return;
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width:  { ideal: 1920 },
        height: { ideal: 1080 }
      }
    });
    video.srcObject = stream;
    video.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'none';
    await video.play();
  } catch (err) {
    showError(
      err && err.name === 'NotAllowedError'
        ? 'Camera permission was denied. Allow it in your browser settings and reload.'
        : 'Could not start the camera.<br><small>' + (err && err.message ? err.message : err) + '</small>'
    );
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  video.srcObject = null;
}

function showError(html) {
  errBox.innerHTML = html;
  errBox.hidden = false;
}

/* =========================================================
   TILT / LEVEL
   ========================================================= */
async function requestTiltPermission() {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const res = await DeviceOrientationEvent.requestPermission();
      return res === 'granted';
    } catch (e) { return false; }
  }
  return typeof DeviceOrientationEvent !== 'undefined';
}

function getScreenAngle() {
  if (screen.orientation && typeof screen.orientation.angle === 'number') {
    return screen.orientation.angle;
  }
  if (typeof window.orientation === 'number') return window.orientation;
  return 0;
}

function attachTilt() {
  if (tiltAttached) return;
  tiltAttached = true;

  window.addEventListener('deviceorientation', (e) => {
    if (e.beta == null || e.gamma == null) return;

    const b  = e.beta  * Math.PI / 180;
    const g  = e.gamma * Math.PI / 180;
    const t  = getScreenAngle() * Math.PI / 180;

    const gx = -Math.cos(b) * Math.sin(g);
    const gy = -Math.sin(b);
    const gz = -Math.cos(b) * Math.cos(g);

    const gRight =  gx * Math.cos(t) - gy * Math.sin(t);
    const gDown  =  gx * Math.sin(t) + gy * Math.cos(t);

    rollCW    = Math.atan2(gRight, gDown) * 180 / Math.PI;
    elevation = Math.asin(Math.max(-1, Math.min(1, gz))) * 180 / Math.PI;

    tiltActive = true;
  }, true);
}

permBtn.addEventListener('click', async () => {
  const ok = await requestTiltPermission();
  if (ok) { attachTilt(); permBtn.hidden = true; }
});

/* =========================================================
   OVERLAY RENDERING
   ========================================================= */
function startLoop() {
  if (rafId) return;
  const loop = () => { drawOverlay(); rafId = requestAnimationFrame(loop); };
  rafId = requestAnimationFrame(loop);
}
function stopLoop() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
}

function drawOverlay() {
  const w = overlay.clientWidth;
  const h = overlay.clientHeight;
  if (!w || !h) return;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (overlay.width !== Math.round(w * dpr) || overlay.height !== Math.round(h * dpr)) {
    overlay.width  = Math.round(w * dpr);
    overlay.height = Math.round(h * dpr);
  }
  const ctx = overlay.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const m = MODES[currentMode];
  if (!m) return;

  drawGrid(ctx, w, h);

  // Composition guide (grid, circle, band, etc.)
  switch (m.guide) {
    case 'portrait':  drawPortraitGuides(ctx, w, h); break;
    case 'landscape': drawLandscape(ctx, w, h); break;
    case 'selfie':    drawSelfieGuides(ctx, w, h); break;
    case 'group':     drawGroupGuides(ctx, w, h); break;
    case 'circle':    drawCircle(ctx, w, h, 0.50, 0.50, 0.34); break;
    case 'food':      drawCircle(ctx, w, h, 0.50, 0.47, 0.32); break;
    case 'full':      drawFullBodyGuides(ctx, w, h); break;
  }

  // THE SHALLOW POSE LINE — soft figure showing head / body / leg placement
  if (m.figure) drawFigureGuide(ctx, w, h, m.figure);

  // Horizon guide line (roll + pitch)
  const rollAligned = tiltActive && Math.abs(rollCW - m.targetRoll) < 2;
  drawGuideLine(ctx, w, h, m.targetRoll, rollAligned);
  drawPitchMeter(ctx, w, h, m.targetElevation);
  updateStatus(m, rollAligned);
}

/* ---- small helpers ---- */
function line(ctx, x1, y1, x2, y2) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}
function tag(ctx, text, x, y, color, align) {
  ctx.save();
  ctx.font = '600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = align || 'center';
  ctx.shadowColor = 'rgba(0,0,0,.9)';
  ctx.shadowBlur = 6;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawGrid(ctx, w, h) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,230,238,.18)';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 7]);
  ctx.beginPath();
  for (let i = 1; i < 3; i++) {
    ctx.moveTo(w * i / 3, 0); ctx.lineTo(w * i / 3, h);
    ctx.moveTo(0, h * i / 3); ctx.lineTo(w, h * i / 3);
  }
  ctx.stroke();
  ctx.restore();
}

/* =========================================================
   THE SHALLOW POSE LINE  (head, body, legs)
   ---------------------------------------------------------
   A soft, faint figure drawn as a dashed blush-pink line
   with a subtle glow. Shows where the person should stand
   and how the head, torso, arms, and legs should be placed.
   ========================================================= */
function drawFigureGuide(ctx, w, h, fig) {
  if (fig.type === 'cluster') {
    const r = w * fig.headR;
    drawPersonFigure(ctx, w * 0.27, h * (fig.headCy + 0.035), r * 0.92, 'bust');
    drawPersonFigure(ctx, w * 0.50, h * fig.headCy,            r,        'bust');
    drawPersonFigure(ctx, w * 0.73, h * (fig.headCy + 0.020), r * 0.92, 'bust');
  } else {
    drawPersonFigure(ctx, w * 0.5, h * fig.headCy, w * fig.headR, fig.pose);
  }
}

function drawPersonFigure(ctx, cx, headCy, headR, pose) {
  const s = headR;

  ctx.save();
  ctx.strokeStyle = 'rgba(247,184,196,.55)';
  ctx.lineWidth = 1.7;
  ctx.setLineDash([6, 6]);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(247,184,196,.55)';
  ctx.shadowBlur = 7;

  // --- HEAD ---
  ctx.beginPath();
  ctx.arc(cx, headCy, s, 0, Math.PI * 2);
  ctx.stroke();

  // --- NECK ---
  const neckTop = headCy + s * 0.92;
  const neckH   = s * 0.42;
  const shoulderY = neckTop + neckH;
  ctx.beginPath();
  ctx.moveTo(cx - s * 0.30, neckTop);
  ctx.lineTo(cx - s * 0.30, shoulderY);
  ctx.moveTo(cx + s * 0.30, neckTop);
  ctx.lineTo(cx + s * 0.30, shoulderY);
  ctx.stroke();

  // --- SHOULDERS ---
  const shoulderW = s * 2.4;
  const shoulderDropY = shoulderY + s * 0.18;
  ctx.beginPath();
  ctx.moveTo(cx - shoulderW * 0.5, shoulderDropY);
  ctx.quadraticCurveTo(cx, shoulderY - s * 0.12, cx + shoulderW * 0.5, shoulderDropY);
  ctx.stroke();

  // --- TORSO (tapered sides) ---
  const torsoH = s * 2.6;
  const waistY = shoulderY + torsoH;
  const waistW = shoulderW * 0.82;
  ctx.beginPath();
  ctx.moveTo(cx - shoulderW * 0.5, shoulderDropY);
  ctx.quadraticCurveTo(cx - waistW * 0.62, shoulderY + torsoH * 0.55,
                        cx - waistW * 0.5, waistY);
  ctx.moveTo(cx + shoulderW * 0.5, shoulderDropY);
  ctx.quadraticCurveTo(cx + waistW * 0.62, shoulderY + torsoH * 0.55,
                        cx + waistW * 0.5, waistY);
  ctx.stroke();

  // --- BUST: stop here with a soft waist tick ---
  if (pose === 'bust') {
    ctx.setLineDash([3, 6]);
    ctx.beginPath();
    ctx.moveTo(cx - waistW * 0.5, waistY);
    ctx.lineTo(cx + waistW * 0.5, waistY);
    ctx.stroke();
    ctx.restore();
    return;
  }

  // --- ARMS (relaxed along the sides) ---
  const armLen = s * 3.0;
  const armOut = s * 0.30;
  ctx.beginPath();
  ctx.moveTo(cx - shoulderW * 0.5 + s * 0.05, shoulderDropY + s * 0.25);
  ctx.quadraticCurveTo(cx - shoulderW * 0.5 - armOut,
                        shoulderY + armLen * 0.55,
                        cx - shoulderW * 0.5 - armOut * 0.5,
                        shoulderY + armLen);
  ctx.moveTo(cx + shoulderW * 0.5 - s * 0.05, shoulderDropY + s * 0.25);
  ctx.quadraticCurveTo(cx + shoulderW * 0.5 + armOut,
                        shoulderY + armLen * 0.55,
                        cx + shoulderW * 0.5 + armOut * 0.5,
                        shoulderY + armLen);
  ctx.stroke();

  // --- HIPS / LEGS ---
  const legLen = s * 3.6;
  const legSpread = s * 0.55;
  ctx.beginPath();
  ctx.moveTo(cx - waistW * 0.30, waistY);
  ctx.quadraticCurveTo(cx - legSpread - s * 0.18, waistY + legLen * 0.55,
                        cx - legSpread, waistY + legLen);
  ctx.moveTo(cx + waistW * 0.30, waistY);
  ctx.quadraticCurveTo(cx + legSpread + s * 0.18, waistY + legLen * 0.55,
                        cx + legSpread, waistY + legLen);
  ctx.stroke();

  // --- FEET ---
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.ellipse(cx - legSpread, waistY + legLen + s * 0.05,
              s * 0.30, s * 0.12, 0, 0, Math.PI * 2);
  ctx.ellipse(cx + legSpread, waistY + legLen + s * 0.05,
              s * 0.30, s * 0.12, 0, 0, Math.PI * 2);
  ctx.stroke();

  ctx.restore();
}

/* =========================================================
   HORIZON GUIDE LINE  (roll reference you align to)
   ========================================================= */
function drawGuideLine(ctx, w, h, targetRoll, aligned) {
  const cy = h * 0.52;
  const half = Math.hypot(w, h) * 0.62;

  const tint = aligned ? '247,184,196' : '255,245,230';
  const baseAlpha = aligned ? 0.90 : 0.55;

  // dashed ghost target
  ctx.save();
  ctx.translate(w / 2, cy);
  ctx.rotate(targetRoll * Math.PI / 180);
  ctx.setLineDash([16, 14]);
  ctx.lineWidth = 1.3;
  ctx.strokeStyle = aligned
    ? 'rgba(247,184,196,0.30)'
    : 'rgba(255,245,230,0.22)';
  ctx.beginPath();
  ctx.moveTo(-half, 0);
  ctx.lineTo(half, 0);
  ctx.stroke();
  ctx.restore();

  // live line
  ctx.save();
  ctx.translate(w / 2, cy);
  ctx.rotate((tiltActive ? rollCW : targetRoll) * Math.PI / 180);

  const grad = ctx.createLinearGradient(-half, 0, half, 0);
  grad.addColorStop(0.00, `rgba(${tint},0)`);
  grad.addColorStop(0.18, `rgba(${tint},${baseAlpha})`);
  grad.addColorStop(0.82, `rgba(${tint},${baseAlpha})`);
  grad.addColorStop(1.00, `rgba(${tint},0)`);

  ctx.shadowColor = aligned
    ? 'rgba(247,184,196,0.9)'
    : 'rgba(255,245,230,0.5)';
  ctx.shadowBlur  = aligned ? 20 : 9;
  ctx.lineWidth   = aligned ? 2.6 : 2;
  ctx.strokeStyle = grad;
  ctx.beginPath();
  ctx.moveTo(-half, 0);
  ctx.lineTo(half, 0);
  ctx.stroke();
  ctx.restore();

  // centre tick
  ctx.save();
  ctx.translate(w / 2, cy);
  ctx.rotate((tiltActive ? rollCW : targetRoll) * Math.PI / 180);
  ctx.beginPath();
  ctx.arc(0, 0, 4.5, 0, Math.PI * 2);
  ctx.fillStyle = aligned ? '#f7b8c4' : 'rgba(255,245,230,.9)';
  ctx.shadowColor = 'rgba(0,0,0,.8)';
  ctx.shadowBlur = 7;
  ctx.fill();
  ctx.restore();

  // end caps
  ctx.save();
  ctx.translate(w / 2, cy);
  ctx.rotate((tiltActive ? rollCW : targetRoll) * Math.PI / 180);
  [-half + 30, half - 30].forEach(x => {
    ctx.beginPath();
    ctx.arc(x, 0, 2.6, 0, Math.PI * 2);
    ctx.fillStyle = aligned ? 'rgba(247,184,196,.95)' : 'rgba(255,245,230,.7)';
    ctx.fill();
  });
  ctx.restore();
}

/* =========================================================
   PITCH METER
   ========================================================= */
function drawPitchMeter(ctx, w, h, target) {
  const range = 60;
  const barH  = Math.min(h * 0.36, 220);
  const barW  = 6;
  const x     = w - 22;
  const cy    = h * 0.50;
  const top   = cy - barH / 2;

  const map = v => {
    const c = Math.max(-range, Math.min(range, v));
    return top + barH / 2 - (c / range) * (barH / 2);
  };

  ctx.save();
  roundRect(ctx, x - barW / 2, top, barW, barH, barW / 2);
  ctx.fillStyle = 'rgba(0,0,0,.42)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,230,238,.22)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();

  const ty = map(target);
  ctx.save();
  ctx.strokeStyle = '#f7b8c4';
  ctx.lineWidth = 2;
  ctx.shadowColor = 'rgba(247,184,196,.85)';
  ctx.shadowBlur = 9;
  ctx.beginPath();
  ctx.moveTo(x - 11, ty);
  ctx.lineTo(x + 11, ty);
  ctx.stroke();
  ctx.restore();

  const iy = map(tiltActive ? elevation : target);
  const ok = tiltActive && Math.abs(elevation - target) < 3;
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, iy, 6.5, 0, Math.PI * 2);
  ctx.fillStyle = ok ? '#f7b8c4' : '#fff5e6';
  ctx.shadowColor = ok ? 'rgba(247,184,196,.95)' : 'rgba(0,0,0,.7)';
  ctx.shadowBlur = 9;
  ctx.fill();
  ctx.restore();

  tag(ctx, 'UP',   x, top - 10, 'rgba(255,230,238,.5)');
  tag(ctx, 'DOWN', x, top + barH + 16, 'rgba(255,230,238,.5)');

  if (tiltActive) {
    const diff = target - elevation;
    if (Math.abs(diff) >= 3) {
      const dir = diff < 0 ? 'DOWN' : 'UP';
      tag(ctx, `TILT ${dir} ${Math.abs(diff).toFixed(0)}°`,
          x - 12, top - 10, '#fff5e6', 'right');
    } else {
      tag(ctx, 'ANGLE ✓', x - 12, top - 10, '#f7b8c4', 'right');
    }
  }
}

/* =========================================================
   COMPOSITION GUIDES (small, complementary)
   ========================================================= */
function drawPortraitGuides(ctx, w, h) {
  // Eye line only — the figure handles head/shoulders
  ctx.save();
  ctx.strokeStyle = 'rgba(247,184,196,.9)';
  ctx.lineWidth = 1.4;
  ctx.setLineDash([6, 6]);
  const ey = h * 0.30 - w * 0.078 * 0.15;
  line(ctx, w * 0.5 - w * 0.09, ey, w * 0.5 + w * 0.09, ey);
  ctx.setLineDash([]);
  tag(ctx, 'EYES ON UPPER THIRD', w / 2, ey - 8, '#f7b8c4');
  ctx.restore();
}

function drawLandscape(ctx, w, h) {
  ctx.save();
  ctx.setLineDash([10, 8]);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(255,230,238,.55)';
  line(ctx, 0, h / 3, w, h / 3);
  line(ctx, 0, h * 2 / 3, w, h * 2 / 3);
  ctx.setLineDash([]);
  tag(ctx, 'SKY HERO → HORIZON LOW',  w / 2, h / 3 - 10, 'rgba(255,230,238,.85)');
  tag(ctx, 'LAND HERO → HORIZON HIGH', w / 2, h * 2 / 3 - 10, 'rgba(255,230,238,.85)');
  ctx.restore();
}

function drawSelfieGuides(ctx, w, h) {
  // Eye line only
  ctx.save();
  ctx.strokeStyle = 'rgba(247,184,196,.9)';
  ctx.lineWidth = 1.4;
  ctx.setLineDash([6, 6]);
  const ey = h * 0.27 - w * 0.066 * 0.1;
  line(ctx, w * 0.5 - w * 0.08, ey, w * 0.5 + w * 0.08, ey);
  ctx.setLineDash([]);
  tag(ctx, 'SMALL FACE · SOFT LIGHT', w / 2, ey - 8, '#f7b8c4');
  ctx.restore();
}

function drawGroupGuides(ctx, w, h) {
  ctx.save();
  const top = h * 0.24, bot = h * 0.68;

  ctx.setLineDash([10, 8]);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(255,230,238,.55)';
  line(ctx, 0, top, w, top);
  line(ctx, 0, bot, w, bot);

  ctx.setLineDash([]);
  tag(ctx, 'LOOSE CLUSTER · WARM LIGHT', w / 2, top - 12, 'rgba(255,230,238,.85)');
  ctx.restore();
}

function drawCircle(ctx, w, h, cxF, cyF, rF) {
  ctx.save();
  const cx = w * cxF, cy = h * cyF;
  const r = Math.min(w, h) * rF;

  ctx.strokeStyle = 'rgba(255,230,238,.85)';
  ctx.lineWidth = 1.7;
  ctx.setLineDash([8, 7]);
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();

  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(255,230,238,.5)';
  ctx.lineWidth = 1.2;
  const t = r * 0.14;
  line(ctx, cx - t, cy, cx + t, cy);
  line(ctx, cx, cy - t, cx, cy + t);
  ctx.restore();
}

function drawFullBodyGuides(ctx, w, h) {
  // Head-top line + feet line only — the figure handles body
  ctx.save();
  ctx.strokeStyle = 'rgba(247,184,196,.9)';
  ctx.lineWidth = 1.4;
  ctx.setLineDash([7, 6]);

  const headTopY = h * 0.155 - w * 0.042;    // top of head circle
  const feetY    = h * 0.93;

  line(ctx, w * 0.14, headTopY, w * 0.86, headTopY);
  line(ctx, w * 0.14, feetY,    w * 0.86, feetY);

  ctx.setLineDash([]);
  tag(ctx, 'HEAD TOP', w * 0.5, headTopY - 7, '#f7b8c4');
  tag(ctx, 'FEET',     w * 0.5, feetY + 16,    '#f7b8c4');
  ctx.restore();
}

/* =========================================================
   STATUS PILL
   ========================================================= */
function updateStatus(m, rollAligned) {
  if (!tiltActive) {
    statusPill.classList.remove('ok');
    statusText.textContent = 'Motion off — tilt guide inactive';
    return;
  }
  const pitchOk = Math.abs(elevation - m.targetElevation) < 3;
  if (rollAligned && pitchOk) {
    statusPill.classList.add('ok');
    statusText.textContent = 'Aesthetic ✓ ready to shoot';
  } else {
    statusPill.classList.remove('ok');
    if (!rollAligned) {
      statusText.textContent = `Tilt ${Math.abs(rollCW).toFixed(0)}° to level`;
    } else {
      const diff = m.targetElevation - elevation;
      statusText.textContent =
        `Angle phone ${diff < 0 ? 'down' : 'up'} ${Math.abs(diff).toFixed(0)}°`;
    }
  }
}

/* =========================================================
   CAPTURE
   ========================================================= */
document.getElementById('shutterBtn').addEventListener('click', capture);

function capture() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;

  const dw = camScreen.clientWidth, dh = camScreen.clientHeight;
  const scale = Math.max(dw / vw, dh / vh);
  const sw = Math.min(vw, dw / scale);
  const sh = Math.min(vh, dh / scale);
  const sx = (vw - sw) / 2;
  const sy = (vh - sh) / 2;

  const outScale = Math.min(1, 1600 / sw);
  const out = document.createElement('canvas');
  out.width  = Math.round(sw * outScale);
  out.height = Math.round(sh * outScale);

  const octx = out.getContext('2d');
  if (facingMode === 'user') {
    octx.translate(out.width, 0);
    octx.scale(-1, 1);
  }
  octx.drawImage(video, sx, sy, sw, sh, 0, 0, out.width, out.height);

  const url = out.toDataURL('image/jpeg', 0.92);
  shotImg.src = url;
  saveBtn.href = url;

  showScreen('previewScreen');
}

/* =========================================================
   NAVIGATION
   ========================================================= */
document.getElementById('backBtn').addEventListener('click', () => {
  stopCamera();
  stopLoop();
  currentMode = null;
  showScreen('menuScreen');
});

document.getElementById('flipBtn').addEventListener('click', () => {
  facingMode = (facingMode === 'environment') ? 'user' : 'environment';
  startCamera();
});

document.getElementById('retakeBtn').addEventListener('click', () => {
  showScreen('camScreen');
  startLoop();
});

window.addEventListener('orientationchange', () => setTimeout(drawOverlay, 250));
window.addEventListener('resize', drawOverlay);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopLoop();
  else if (camScreen.classList.contains('active')) startLoop();
});
</script>
