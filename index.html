<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Camera Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2.5rem;
            color: #2c3e50;
            text-align: center;
        }

        .menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        .menu-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-top: 5px solid #bdc3c7;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        /* Custom styling colors for each button */
        .gemini { border-top-color: #1a73e8; color: #1a73e8; }
        .claude { border-top-color: #d97706; color: #d97706; }
        .deepseek { border-top-color: #2563eb; color: #2563eb; }
        .chatgpt { border-top-color: #10b981; color: #10b981; }

        .card-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .card-desc {
            font-size: 0.9rem;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <h1>AI Camera Dashboard</h1>

    <nav class="menu-container">
        <a href="geminicam.html" class="menu-card gemini">
            <div class="card-title">Gemini Cam</div>
            <div class="card-desc">Launch Gemini stream feed</div>
        </a>

        <a href="claudecam.html" class="menu-card claude">
            <div class="card-title">Claude Cam</div>
            <div class="card-desc">Launch Claude stream feed</div>
        </a>

        <a href="dscam.html" class="menu-card deepseek">
            <div class="card-title">DeepSeek Cam</div>
            <div class="card-desc">Launch DeepSeek stream feed</div>
        </a>

        <a href="chatgptcam.html" class="menu-card chatgpt">
            <div class="card-title">ChatGPT Cam</div>
            <div class="card-desc">Launch ChatGPT stream feed</div>
        </a>
    </nav>

</body>
</html>
